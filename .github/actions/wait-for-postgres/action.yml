name: "Wait for Postgres"
description: "Ensure Postgres is reachable; optionally install client"
inputs:
  host:
    description: "Postgres host"
    required: false
    default: "127.0.0.1"
  port:
    description: "Postgres port"
    required: true
  user:
    description: "Postgres user"
    required: true
  install-client:
    description: "Install postgresql-client on Linux"
    required: false
    default: 'true'
  client-version:
    description: "Optional PostgreSQL major version for backup/restore tools"
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Install client (Linux)
      if: runner.os == 'Linux' && inputs.install-client == 'true'
      shell: bash
      run: |
        if command -v pg_isready >/dev/null 2>&1; then
          exit 0
        fi
        if [ -d /etc/apt/sources.list.d ]; then
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d | xargs -r sudo rm -f || true
          grep -rl 'azure.archive.ubuntu.com' /etc/apt/sources.list.d | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' || true
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
        fi
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
        source "${{ github.action_path }}/../apt-bounded.sh"
        apt_bounded update "${apt_opts[@]}"
        apt_bounded install -y --no-install-recommends "${apt_opts[@]}" postgresql-client

    - name: Select versioned client (Linux)
      if: runner.os == 'Linux' && inputs.install-client == 'true' && inputs.client-version != ''
      shell: bash
      env:
        PG_CLIENT_VERSION: ${{ inputs.client-version }}
      run: |
        if [[ ! "$PG_CLIENT_VERSION" =~ ^[0-9]+$ ]]; then
          echo "Invalid PostgreSQL client major version" >&2; exit 1
        fi
        client_bin="/usr/lib/postgresql/$PG_CLIENT_VERSION/bin"
        if [ ! -x "$client_bin/pg_dump" ] || [ ! -x "$client_bin/pg_restore" ]; then
          # Ubuntu's default client can be older than the service's backup format.
          source /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --connect-timeout 20 --max-time 60 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          source "${{ github.action_path }}/../apt-bounded.sh"
          apt_bounded update "${apt_opts[@]}"
          apt_bounded install -y --no-install-recommends "${apt_opts[@]}" "postgresql-client-$PG_CLIENT_VERSION"
        fi
        "$client_bin/pg_dump" --version
        "$client_bin/pg_restore" --version
        echo "$client_bin" >> "$GITHUB_PATH"

    - name: Wait for Postgres
      shell: bash
      run: |
        host='${{ inputs.host }}'
        port='${{ inputs.port }}'
        user='${{ inputs.user }}'
        echo "Waiting for Postgres at ${host}:${port} as ${user}"
        for i in {1..60}; do
          if pg_isready -h "$host" -p "$port" -U "$user"; then
            echo "Postgres is ready"; exit 0; fi;
          echo "Attempt $i: waiting for Postgres..."; sleep 2;
        done
        echo "Postgres did not become ready in time" >&2; exit 1
