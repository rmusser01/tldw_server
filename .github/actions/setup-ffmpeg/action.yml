name: "Setup FFmpeg"
description: "Install FFmpeg across platforms; optionally install PortAudio"
inputs:
  install-ffmpeg:
    description: "Install FFmpeg"
    required: false
    default: 'true'
  install-portaudio:
    description: "Also install PortAudio (Linux/macOS)"
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Install FFmpeg (Linux)
      if: runner.os == 'Linux' && (inputs.install-ffmpeg == 'true' || inputs.install-portaudio == 'true')
      shell: bash
      run: |
        if [ -d /etc/apt/sources.list.d ]; then
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d | xargs -r sudo rm -f || true
          grep -rl 'azure.archive.ubuntu.com' /etc/apt/sources.list.d | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' || true
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
        fi
        sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        if [ "${{ inputs.install-ffmpeg }}" = "true" ] && [ "${{ inputs.install-portaudio }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends ffmpeg portaudio19-dev python3-all-dev
        elif [ "${{ inputs.install-ffmpeg }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends ffmpeg
        elif [ "${{ inputs.install-portaudio }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends portaudio19-dev python3-all-dev
        fi
    - name: Install FFmpeg (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if [ "${{ inputs.install-portaudio }}" = "true" ]; then
          if ! xcrun --find clang >/dev/null 2>&1; then
            for developer_dir in \
              /Applications/Xcode.app/Contents/Developer \
              /Library/Developer/CommandLineTools \
              /Applications/Xcode_*.app/Contents/Developer; do
              [ -d "$developer_dir" ] || continue
              sudo xcode-select -s "$developer_dir" || true
              if xcrun --find clang >/dev/null 2>&1; then
                break
              fi
            done
          fi
          if ! clang_path="$(xcrun --find clang)"; then
            echo "::error::Unable to locate a working macOS clang toolchain for native Python wheels"
            exit 1
          fi
          if ! sdk_path="$(xcrun --sdk macosx --show-sdk-path)"; then
            echo "::error::Unable to locate a working macOS SDK for native Python wheels"
            exit 1
          fi
          echo "CC=$clang_path" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
        fi
        if [ "${{ inputs.install-ffmpeg }}" = "true" ]; then
          brew install ffmpeg || true
        fi
        if [ "${{ inputs.install-portaudio }}" = "true" ]; then
          for attempt in 1 2 3; do
            if brew install portaudio; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              brew install --build-from-source portaudio
            else
              sleep $((attempt * 10))
            fi
          done
          test -f "$(brew --prefix portaudio)/include/portaudio.h"
          portaudio_prefix="$(brew --prefix portaudio)"
          echo "CFLAGS=-I$portaudio_prefix/include${CFLAGS:+ $CFLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$portaudio_prefix/lib${LDFLAGS:+ $LDFLAGS}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$portaudio_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        fi
    - name: Install FFmpeg (Windows)
      if: runner.os == 'Windows' && inputs.install-ffmpeg == 'true'
      shell: bash
      run: |
        choco install ffmpeg -y || choco upgrade ffmpeg -y || true
