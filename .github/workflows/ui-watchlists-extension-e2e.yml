name: UI Watchlists Extension E2E

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "apps/extension/tests/e2e/watchlists.spec.ts"
      - "apps/extension/tests/e2e/prompt-improvement.spec.ts"
      - "apps/extension/tests/e2e/utils/**"
      - "apps/extension/package.json"
      - "apps/extension/playwright.config.ts"
      - "apps/packages/ui/src/components/Chat/composer/**"
      - "apps/packages/ui/src/components/Common/PromptAssist/**"
      - "apps/packages/ui/src/components/Option/Playground/**"
      - "apps/packages/ui/src/components/Sidepanel/Chat/**"
      - "apps/packages/ui/src/components/Option/Watchlists/**"
      - "apps/packages/ui/src/services/prompt-improvement.ts"
      - "apps/packages/ui/src/services/prompts-api.ts"
      - "apps/packages/ui/src/services/watchlists.ts"
      - "apps/packages/ui/src/types/watchlists.ts"
      - "apps/bun.lock"
      - ".github/workflows/ui-watchlists-extension-e2e.yml"
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "apps/extension/tests/e2e/watchlists.spec.ts"
      - "apps/extension/tests/e2e/prompt-improvement.spec.ts"
      - "apps/extension/tests/e2e/utils/**"
      - "apps/extension/package.json"
      - "apps/extension/playwright.config.ts"
      - "apps/packages/ui/src/components/Chat/composer/**"
      - "apps/packages/ui/src/components/Common/PromptAssist/**"
      - "apps/packages/ui/src/components/Option/Playground/**"
      - "apps/packages/ui/src/components/Sidepanel/Chat/**"
      - "apps/packages/ui/src/components/Option/Watchlists/**"
      - "apps/packages/ui/src/services/prompt-improvement.ts"
      - "apps/packages/ui/src/services/prompts-api.ts"
      - "apps/packages/ui/src/services/watchlists.ts"
      - "apps/packages/ui/src/types/watchlists.ts"
      - "apps/bun.lock"
      - ".github/workflows/ui-watchlists-extension-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-watchlists-extension-e2e-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: ui-watchlists-extension-e2e.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  watchlists-extension-e2e:
    name: Watchlists + Prompt Improvement Extension E2E (No Skips)
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      DISABLE_HEAVY_STARTUP: "1"
      MINIMAL_TEST_APP: "1"
      PRIVILEGE_METADATA_VALIDATE_ON_STARTUP: "0"
      AUTH_MODE: single_user
      SINGLE_USER_API_KEY: watchlists-e2e-key-12345
      SERVER_LABEL: watchlists-extension-e2e
      TLDW_E2E_SERVER_URL: http://127.0.0.1:8000
      TLDW_E2E_API_KEY: watchlists-e2e-key-12345
      TLDW_E2E_EXTENSION_LAUNCH_TIMEOUT_MS: "90000"
      TLDW_E2E_EXTENSION_TARGET_WAIT_MS: "5000"
      TLDW_E2E_EXTENSION_HEADLESS: "0"
      TLDW_E2E_EXTENSION_MINIMAL_LOCALES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install workspace dependencies
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Build Chrome extension
        working-directory: apps/extension
        run: bun run build:chrome:prod

      - name: Install Playwright Chromium
        working-directory: apps/extension
        timeout-minutes: 10
        run: ../node_modules/.bin/playwright install --with-deps chromium

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-portaudio: "true"

      - name: Setup Python and server dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start backend server (single-user)
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py start

      - name: Backend health check
        if: always()
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py health-check

      - name: Run Watchlists extension Playwright spec (strict no-skip gate)
        working-directory: apps/extension
        run: |
          set +e
          xvfb-run -a bun run test:e2e:watchlists:strict
          status=$?
          mkdir -p test-results
          if [ -f .watchlists-e2e-report.json ]; then
            cp .watchlists-e2e-report.json test-results/watchlists-e2e-report.json
          fi
          exit "$status"

      - name: Run prompt improvement extension Playwright spec (strict no-skip gate)
        working-directory: apps/extension
        run: |
          set +e
          xvfb-run -a bun run test:e2e:prompt-improvement:strict
          status=$?
          mkdir -p test-results
          if [ -f .prompt-improvement-e2e-report.json ]; then
            cp .prompt-improvement-e2e-report.json test-results/prompt-improvement-e2e-report.json
          fi
          exit "$status"

      - name: Upload watchlists e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watchlists-extension-e2e-artifacts
          if-no-files-found: ignore
          path: |
            apps/extension/test-results/**
            apps/extension/playwright-report/**

      - name: Print backend server log on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib

          label = os.environ.get("SERVER_LABEL", "watchlists-extension-e2e")
          log_path = pathlib.Path(f"server-{label}.log")
          if log_path.exists():
              print("===== backend server log =====")
              print(log_path.read_text(encoding="utf-8"))
          PY

      - name: Stop backend server
        if: always()
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py stop || true
