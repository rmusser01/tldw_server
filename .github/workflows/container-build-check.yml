name: container-build-check

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-check-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: container-build-check.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  build:
    name: build (${{ matrix.name }})
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfiles/Dockerfile.prod
            build_args: ""
            backend: true
          - name: worker
            dockerfile: Dockerfiles/Dockerfile.worker
            build_args: ""
            backend: true
          - name: audio-worker
            dockerfile: Dockerfiles/Dockerfile.audio_gpu_worker
            build_args: ""
            backend: true
          - name: webui
            dockerfile: Dockerfiles/Dockerfile.webui
            backend: false
            build_args: |
              NEXT_PUBLIC_API_URL=
              NEXT_PUBLIC_API_BASE_URL=
              NEXT_PUBLIC_API_VERSION=v1
              NEXT_PUBLIC_X_API_KEY=
              NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE=quickstart
              TLDW_INTERNAL_API_ORIGIN=http://app:8000
          - name: admin-ui
            dockerfile: Dockerfiles/Dockerfile.admin-ui
            backend: false
            build_args: |
              NEXT_PUBLIC_API_URL=http://app:8000
              NEXT_PUBLIC_API_VERSION=v1
              NEXT_PUBLIC_DEFAULT_AUTH_MODE=multi_user
              NEXT_PUBLIC_ALLOW_ADMIN_API_KEY_LOGIN=false
              NEXT_PUBLIC_BILLING_ENABLED=false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build container images
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: ${{ matrix.backend }}
          tags: tldw-container-check:${{ matrix.name }}

      - name: Verify backend local package imports
        if: matrix.backend
        env:
          IMAGE_REF: tldw-container-check:${{ matrix.name }}
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "$image_id" -I -c \
            "import mcp_unified; import tldw_profile_core"

  container-build-check:
    name: container-build-check
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    needs: [build, admission, await_license]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more container builds failed"
            exit 1
          fi

  # Wakes the merge queue when the gate above fails (TASK-13462, section 4.6 of
  # Docs/superpowers/specs/2026-10-04-merge-queue-design.md). A red gate causes
  # none of the events merge-queue.yml listens for, so without this a failed
  # front PR would never be retried or removed from the line.
  #
  # Not required and in no job's `needs`, so it cannot turn the required check
  # red. Skipped on every run while the repository variable MERGE_QUEUE is unset
  # or off, and for fork PRs. It checks out dev, never the PR, so the queue
  # script that runs with these write permissions is dev's copy.
  queue-tick:
    name: Merge queue tick
    needs: [container-build-check]
    if: >-
      always() && !cancelled() &&
      needs.container-build-check.result == 'failure' &&
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write: rebase the front PR's branch, comment and disarm, dispatch/cancel/delete runs.
      contents: write
      pull-requests: write
      actions: write
      # read: the six required check runs and the license commit status on the front PR's head.
      checks: read
      statuses: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dev
          persist-credentials: false
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
        run: python3 -m Helper_Scripts.ci.merge_queue
