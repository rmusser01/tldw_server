name: e2e-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for change detection (manual diagnostic dispatches)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-required-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: e2e-required.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed || steps.detect_admitted.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed || steps.detect_admitted.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed || steps.detect_admitted.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed || steps.detect_admitted.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required || steps.detect_admitted.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/detect-required-gate-changes
      - id: detect_admitted
        name: Classify admitted changed files
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES_PATH="${RUNNER_TEMP}/required-gate-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES_PATH"
          mapfile -t CHANGED_FILES < "$CHANGED_FILES_PATH"
          python -m Helper_Scripts.ci.emit_ci_gate_flags "${CHANGED_FILES[@]}"

  e2e-required:
    name: e2e-required
    runs-on: ubuntu-latest
    needs: [changes, admission, await_license]
    # Runs whenever change detection was admitted, not only when it succeeded,
    # and also when the license wait did not pass: in both cases this job used
    # to be skipped, and GitHub counts a skipped required job as satisfied. It
    # now runs and its first steps fail it (TASK-13462, TASK-13502). Only the
    # workflow_run path with admission declined still skips it, as before.
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        ) ||
        (
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        )
      )
    timeout-minutes: 40
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_INPROCESS: "1"
      AUTH_MODE: single_user
      TEST_MODE: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      SINGLE_USER_TEST_API_KEY: test-api-key-for-e2e-testing-12345
      # TEST_MODE returns a deterministic completion after credential resolution.
      OPENAI_API_KEY: sk-test-e2e-required-not-a-real-key
      REDIS_URL: redis://127.0.0.1:6379/0
      EMBEDDINGS_REDIS_URL: redis://127.0.0.1:6379/0
      WORKFLOWS_EGRESS_ALLOWLIST: "93.184.216.34,does-not-resolve.invalid,example.com"
    steps:
      - name: Require the license audit to have passed
        if: >-
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        run: |
          echo "::error::License audit did not pass for this PR head, so the gates were not run. Fix the licence policy failure and re-run."
          exit 1

      # Stays directly after the license refusal: no later step uses a status
      # function, so none runs once either has failed.
      - name: Require change detection to have succeeded
        if: needs.changes.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::Change detection (the 'changes' job) ended as '${CHANGES_RESULT}', not 'success', so this gate cannot tell what the head changed and ran nothing. Re-run the workflow."
          exit 1

      - name: No-op pass (e2e unchanged)
        if: needs.changes.outputs.e2e_changed != 'true'
        run: echo "No e2e-triggering paths changed; e2e-required passed by policy."

      - name: Checkout
        if: needs.changes.outputs.e2e_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        if: needs.changes.outputs.e2e_changed == 'true'
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        if: needs.changes.outputs.e2e_changed == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Run critical e2e suite (attempt 1)
        if: needs.changes.outputs.e2e_changed == 'true'
        id: e2e_primary
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            -p pytest_asyncio.plugin \
            -p tldw_Server_API.tests._plugins.e2e_fixtures \
            -p tldw_Server_API.tests._plugins.e2e_state_fixtures \
            -p tldw_Server_API.tests._plugins.media_fixtures \
            -p tldw_Server_API.tests._plugins.postgres \
            -p tldw_Server_API.tests.helpers.pgvector \
            tldw_Server_API/tests/e2e/ --critical-only -q

      - name: Run critical e2e suite (retry)
        if: needs.changes.outputs.e2e_changed == 'true' && steps.e2e_primary.outcome == 'failure'
        id: e2e_retry
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            -p pytest_asyncio.plugin \
            -p tldw_Server_API.tests._plugins.e2e_fixtures \
            -p tldw_Server_API.tests._plugins.e2e_state_fixtures \
            -p tldw_Server_API.tests._plugins.media_fixtures \
            -p tldw_Server_API.tests._plugins.postgres \
            -p tldw_Server_API.tests.helpers.pgvector \
            tldw_Server_API/tests/e2e/ --critical-only -q

      - name: Fail when both attempts fail
        if: needs.changes.outputs.e2e_changed == 'true' && steps.e2e_primary.outcome == 'failure' && steps.e2e_retry.outcome == 'failure'
        run: |
          echo "e2e-required failed after retry."
          exit 1

  # Wakes the merge queue when the gate above fails (spec 4.6 of
  # Docs/superpowers/specs/2026-10-11-merge-queue-approve-held-runs-design.md). A red gate causes
  # none of the events merge-queue.yml listens for, and GitHub only re-runs a completed run, so
  # this job cannot retry its own run: it dispatches a queue kick on dev that waits for this run
  # to complete, then runs the queue. Not required and in no job's `needs`, so it cannot turn the
  # required check red. Skipped while MERGE_QUEUE is unset or off, for forks, and on dispatches.
  queue-tick:
    name: Merge queue tick
    needs: [e2e-required]
    if: >-
      always() && !cancelled() &&
      needs.e2e-required.result == 'failure' &&
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Wake the merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh api -X POST "repos/${REPOSITORY}/actions/workflows/security-required.yml/dispatches" -f ref=dev -f "inputs[queue_kick]=true" -f "inputs[wait_run]=${RUN_ID}"
