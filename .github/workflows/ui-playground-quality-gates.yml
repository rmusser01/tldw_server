name: UI Playground Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "apps/packages/ui/src/components/Option/Playground/**"
      - "apps/packages/ui/src/components/Common/Playground/**"
      - "apps/packages/ui/src/components/Sidepanel/Chat/**"
      - "apps/packages/ui/src/components/Layouts/**"
      - "apps/packages/ui/src/hooks/playground/**"
      - "apps/packages/ui/package.json"
      - "apps/bun.lock"
      - ".github/workflows/ui-playground-quality-gates.yml"
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "apps/packages/ui/src/components/Option/Playground/**"
      - "apps/packages/ui/src/components/Common/Playground/**"
      - "apps/packages/ui/src/components/Sidepanel/Chat/**"
      - "apps/packages/ui/src/components/Layouts/**"
      - "apps/packages/ui/src/hooks/playground/**"
      - "apps/packages/ui/package.json"
      - "apps/bun.lock"
      - ".github/workflows/ui-playground-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-playground-quality-gates-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: ui-playground-quality-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  playground-quality:
    name: Playground Device/A11y/Composer Gates
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_WXT_PREPARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install workspace dependencies
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Run composer usability gate
        working-directory: apps/packages/ui
        env:
          CI: "true"
        run: bun run test:playground:composer

      - name: Run device matrix gate
        working-directory: apps/packages/ui
        env:
          CI: "true"
        run: bun run test:playground:device-matrix

      - name: Run accessibility gate
        working-directory: apps/packages/ui
        env:
          CI: "true"
        run: bun run test:playground:a11y
