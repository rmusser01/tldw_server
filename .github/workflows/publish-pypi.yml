name: Publish verified tldw-server package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/publish-pypi.yml

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.12.7@sha256:95f2aa1fe59274951cfe9b0cbc7972e879ff1004bc8945d130a32eb0dbd85945

jobs:
  detect-version:
    name: Detect PyPI version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.detect.outputs.version }}
      published: ${{ steps.detect.outputs.published }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Detect version state
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          name = project["name"]
          version = project["version"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          url = f"https://pypi.org/pypi/{urllib.parse.quote(name)}/json"
          published = False
          reason = "manual_dispatch"

          if event_name == "push":
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "tldw-server-publish-workflow",
                  },
              )
              payload = None
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          payload = json.load(response)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          payload = {"releases": {}}
                          break
                      last_error = error
                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError,
                  ) as error:
                      last_error = error
                  if attempt < 2:
                      time.sleep(2**attempt)
              if payload is None:
                  print(
                      f"PyPI lookup failed for {name} {version}: {last_error}",
                      file=sys.stderr,
                  )
                  published = True
                  reason = "pypi_lookup_failed"
              else:
                  published = version in payload.get("releases", {})
                  reason = (
                      "already_published" if published else "missing_from_pypi"
                  )

          should_publish = (
              event_name == "push"
              and not published
              and reason != "pypi_lookup_failed"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              print(f"version={version}", file=output)
              print(f"published={str(published).lower()}", file=output)
              print(f"should_publish={str(should_publish).lower()}", file=output)
              print(f"reason={reason}", file=output)
          PY

  source-admission:
    name: Admit exact source dependencies
    uses: ./.github/workflows/sbom.yml
    permissions:
      contents: read

  test-suite:
    name: Test suite gate
    needs: detect-version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install FFmpeg and PortAudio
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: "false"
          install-portaudio: "true"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          uv_container="$(docker create --platform linux/amd64 "$UV_IMAGE")"
          trap 'docker rm -f "$uv_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$uv_container:/uv" "$RUNNER_TEMP/uv"
          docker rm "$uv_container"
          trap - EXIT
          sudo install -m 0755 "$RUNNER_TEMP/uv" /usr/local/bin/uv
          uv --version | grep -Eq '^uv 0\.12\.7 '

      - name: Sync locked test dependencies
        run: uv sync --locked --no-editable --extra dev

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  build:
    name: Build checked distributions
    needs:
      - detect-version
      - source-admission
      - test-suite
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          uv_container="$(docker create --platform linux/amd64 "$UV_IMAGE")"
          trap 'docker rm -f "$uv_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$uv_container:/uv" "$RUNNER_TEMP/uv"
          docker rm "$uv_container"
          trap - EXIT
          sudo install -m 0755 "$RUNNER_TEMP/uv" /usr/local/bin/uv
          uv --version | grep -Eq '^uv 0\.12\.7 '

      - name: Sync locked release tools
        run: uv sync --locked --no-dev --no-editable --group release

      - name: Build and validate package
        run: >-
          PYTHON=.venv/bin/python PYPI_BUILD_ARGS=--no-isolation
          make pypi-check

      - name: Hash checked distributions
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
            test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
            find . -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-test:
    name: Publish to TestPyPI
    needs:
      - detect-version
      - build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist

      - name: Verify distribution checksums
        run: cd dist && sha256sum -c SHA256SUMS && rm SHA256SUMS

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    needs:
      - detect-version
      - build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') || (github.event_name == 'push' && needs.detect-version.outputs.should_publish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist

      - name: Verify distribution checksums
        run: cd dist && sha256sum -c SHA256SUMS && rm SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          attestations: true
