name: Publish tldw-server PyPI Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/publish-pypi.yml

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect PyPI Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.detect.outputs.version }}
      published: ${{ steps.detect.outputs.published }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Detect package version on PyPI
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          url = f"https://pypi.org/pypi/{urllib.parse.quote(name)}/json"

          published = False
          reason = "manual_dispatch"

          if event_name == "push":
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "tldw-server-publish-workflow",
                  },
              )
              payload = None
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          payload = json.load(response)
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          payload = {"releases": {}}
                          break
                      last_error = exc
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                      last_error = exc
                  if attempt < 2:
                      time.sleep(2 ** attempt)
              if payload is None:
                  print(f"PyPI lookup failed for {name} {version}: {last_error}", file=sys.stderr)
                  published = True
                  reason = "pypi_lookup_failed"
              else:
                  published = version in payload.get("releases", {})
                  reason = "already_published" if published else "missing_from_pypi"

          should_publish = event_name == "push" and not published and reason != "pypi_lookup_failed"


          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"published={str(published).lower()}", file=output)
              print(f"should_publish={str(should_publish).lower()}", file=output)
              print(f"reason={reason}", file=output)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "\n".join(
                  [
                      "## PyPI publish decision",
                      "",
                      f"- Package: `{name}`",
                      f"- Version: `{version}`",
                      f"- Event: `{event_name}`",
                      f"- Already on PyPI: `{str(published).lower()}`",
                      f"- Auto publish: `{str(should_publish).lower()}`",
                      f"- Reason: `{reason}`",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

  test-suite:
    name: Test Suite Gate
    needs: detect-version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build Distributions
    needs:
      - detect-version
      - test-suite
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel loguru

      - name: Build and validate package
        run: make pypi-check

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tldw-server-pypi-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - detect-version
      - build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tldw-server-pypi-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs:
      - detect-version
      - build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') || (github.event_name == 'push' && needs.detect-version.outputs.should_publish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tldw-server-pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
