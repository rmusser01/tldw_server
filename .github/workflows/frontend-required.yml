name: frontend-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Gate Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      tldw_frontend_changed: ${{ steps.detect.outputs.tldw_frontend_changed }}
      family_guardrails_changed: ${{ steps.detect.outputs.family_guardrails_changed }}
      admin_ui_changed: ${{ steps.detect.outputs.admin_ui_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: detect
        name: Classify changed files
        uses: ./.github/actions/detect-required-gate-changes

  frontend-required:
    name: frontend-required
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DISABLE_HEAVY_STARTUP: '1'
      MINIMAL_TEST_APP: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PRIVILEGE_METADATA_VALIDATE_ON_STARTUP: '0'
      SKIP_WXT_PREPARE: '1'
    steps:
      - name: No-op pass (frontend unchanged)
        if: needs.changes.outputs.frontend_changed != 'true'
        run: echo "No frontend paths changed; frontend-required passed by policy."

      - name: Checkout
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Bun
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install frontend dependencies
        if: needs.changes.outputs.tldw_frontend_changed == 'true'
        working-directory: apps
        run: bun install

      - name: Run frontend lint
        if: needs.changes.outputs.tldw_frontend_changed == 'true'
        working-directory: apps/tldw-frontend
        run: bun run lint

      - name: Run frontend unit tests
        if: needs.changes.outputs.tldw_frontend_changed == 'true'
        working-directory: apps/tldw-frontend
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "${BASE_SHA:-}" || "${BASE_SHA:-}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "${BASE_SHA:-}" ]]; then
            echo "Running changed-only frontend unit tests from base SHA ${BASE_SHA}"
            bunx vitest run --changed="${BASE_SHA}"
          else
            echo "No base SHA found; running full frontend unit suite."
            bun run test:run
          fi

      - name: Run family guardrails parity tests
        if: needs.changes.outputs.family_guardrails_changed == 'true'
        working-directory: apps/packages/ui
        run: bun run test:family-guardrails

      - name: Install Playwright Chromium
        if: needs.changes.outputs.family_guardrails_changed == 'true'
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run family guardrails e2e
        if: needs.changes.outputs.family_guardrails_changed == 'true'
        working-directory: apps/tldw-frontend
        run: bun run e2e:family-guardrails

      - name: Install admin-ui dependencies
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bun install

      - name: Install admin-ui Playwright Chromium
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bunx playwright install --with-deps chromium

      - name: Setup Python and server dependencies
        if: needs.changes.outputs.admin_ui_changed == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Run admin-ui lint
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bun run lint

      - name: Run admin-ui typecheck
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bun run typecheck

      - name: Run admin-ui unit tests
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bun run test

      - name: Run admin-ui real-backend e2e
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        env:
          TLDW_ADMIN_E2E_PYTHON: python
        run: bun run test:real-backend -- --project=chromium-real-jwt --project=chromium-real-single-user --reporter=line

      - name: Run admin-ui build
        if: needs.changes.outputs.admin_ui_changed == 'true'
        working-directory: admin-ui
        run: bun run build
