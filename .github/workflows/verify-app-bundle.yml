name: Exercise paired Docker app candidate

# Candidate images stay in a job-local registry. This workflow never publishes
# to GHCR, a release, or the install catalog.
on:
  workflow_dispatch:
  # Bootstrap the new workflow from this branch before it exists on default.
  push:
    branches: [codex/complete-app-wp1]
    paths: [.github/workflows/verify-app-bundle.yml]

permissions:
  contents: read

jobs:
  candidate:
    name: Provisional candidate ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install focused release-test dependencies in a venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install cryptography==45.0.6 pytest PyYAML bandit black

      - name: Verify release, control, and helper contracts
        run: |
          source .venv/bin/activate
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -c /dev/null \
            --confcutdir=tldw_Server_API/tests/Release \
            tldw_Server_API/tests/Release/test_manifest.py \
            tldw_Server_API/tests/Release/test_app_bundle_control.py \
            tldw_Server_API/tests/Release/test_app_bundle_helpers.py \
            tldw_Server_API/tests/Release/test_candidate_gate.py -q
          python -m black --check Helper_Scripts/build_app_bundle.py \
            Helper_Scripts/verify_app_bundle.py \
            tldw_Server_API/app/core/Release/manifest.py \
            tldw_Server_API/scripts/app_bundle_control.py
          python -m bandit -r Helper_Scripts/build_app_bundle.py \
            Helper_Scripts/verify_app_bundle.py \
            tldw_Server_API/app/core/Release/manifest.py \
            tldw_Server_API/scripts/app_bundle_control.py
          bash -n Helper_Scripts/qualify_app_bundle_candidate.sh \
            Helper_Scripts/test_app_bundle_docker.sh
          sh -n Dockerfiles/app-bundle/start.sh Dockerfiles/app-bundle/stop.sh \
            Dockerfiles/app-bundle/status.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.2'

      - name: Verify managed browser and gateway paths
        run: |
          bun install --frozen-lockfile --cwd apps
          cd apps/tldw-frontend
          bunx vitest run \
            __tests__/frontend-quickstart-networking.test.ts \
            __tests__/pages/api/runtime-session.test.ts \
            __tests__/pages/api/runtime-config.test.ts \
            __tests__/extension/runtime-bootstrap.test.ts
          node --test gateway/__tests__/routes.test.mjs gateway/__tests__/server.test.mjs
          bunx eslint gateway/server.mjs gateway/routes.mjs

      - name: Record existing whole-frontend typecheck status
        continue-on-error: true
        run: |
          cd apps/tldw-frontend
          bun run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Record runner disk headroom
        run: |
          df -h / /var/lib/docker
          docker system df

      - name: Build and smoke one native platform without promoting it
        env:
          TLDW_CANDIDATE_PLATFORM: ${{ matrix.platform }}
          TLDW_EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TLDW_CANDIDATE_OUTPUT: ${{ runner.temp }}/app-candidate-${{ matrix.arch }}
        run: Helper_Scripts/qualify_app_bundle_candidate.sh

      - name: Save local-only provisional evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-app-candidate-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/app-candidate-${{ matrix.arch }}/bundle
            ${{ runner.temp }}/app-candidate-${{ matrix.arch }}/inventory.json
            ${{ runner.temp }}/app-candidate-${{ matrix.arch }}/evidence.json
            ${{ runner.temp }}/app-candidate-${{ matrix.arch }}/images.tsv

  powershell-syntax:
    name: Windows helper syntax
    runs-on: windows-2022
    steps:
      - name: Check out helper sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Parse each Windows helper
        shell: pwsh
        run: |
          foreach ($name in @('start.ps1', 'stop.ps1', 'status.ps1')) {
            $path = Join-Path 'Dockerfiles/app-bundle' $name
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$path has PowerShell parser errors: $parseErrors"
            }
          }

  required-platforms:
    name: Both provisional platforms exercised
    needs: [candidate, powershell-syntax]
    runs-on: ubuntu-24.04
    steps:
      - name: Record qualification boundary
        run: |
          echo 'Both job-local platform candidates were exercised.'
          echo 'G2/G4/G12 remain open; no multi-platform release or install-catalog promotion occurred.'
