name: onboarding-docs-gate

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - README.md
      - Docs/**
      - Helper_Scripts/docs/**
      - Helper_Scripts/refresh_docs_published.sh
      - tldw_Server_API/tests/Docs/**
      - .github/workflows/mkdocs.yml
      - .github/workflows/onboarding-docs-gate.yml
      - .github/workflows/onboarding-docs-smoke-nightly.yml
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
      - dev
    paths:
      - README.md
      - Docs/**
      - Helper_Scripts/docs/**
      - Helper_Scripts/refresh_docs_published.sh
      - tldw_Server_API/tests/Docs/**
      - .github/workflows/mkdocs.yml
      - .github/workflows/onboarding-docs-gate.yml
      - .github/workflows/onboarding-docs-smoke-nightly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-docs-gate-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: onboarding-docs-gate.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  onboarding-docs-gate:
    name: onboarding-docs-gate
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Install MkDocs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6.1,<2" "mkdocs-material>=9.7.3,<10" "mkdocs-git-revision-date-localized-plugin>=1.5.1,<2"

      - name: Refresh curated docs
        run: |
          chmod +x Helper_Scripts/refresh_docs_published.sh || true
          bash Helper_Scripts/refresh_docs_published.sh

      - name: Check public/private docs boundary
        run: |
          python Helper_Scripts/docs/check_public_private_boundary.py

      - name: Onboarding command boundary check
        run: |
          python Helper_Scripts/docs/check_onboarding_command_boundaries.py

      - name: Onboarding endpoint drift check
        run: |
          python Helper_Scripts/docs/check_onboarding_endpoint_drift.py

      - name: Docs test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q -p pytest_asyncio.plugin tldw_Server_API/tests/Docs

      - name: MkDocs build
        run: |
          mkdocs build --strict -f Docs/mkdocs.yml
