name: PR2979 native shutdown observation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pr2979-native-shutdown-observation-${{ github.ref }}
  cancel-in-progress: false
env:
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
jobs:
  native-prompt-observation:
    name: Frozen b38 macOS Prompt Studio diagnostic
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_MODE: 'true'
      DISABLE_HEAVY_STARTUP: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TLDW_TEST_NO_DOCKER: '1'
      WORKFLOWS_EGRESS_ALLOWLIST: 93.184.216.34,does-not-resolve.invalid,example.com
      SHARD_NAME: product-prompt-studio
      TEST_PATHS: tldw_Server_API/tests/prompt_studio
      RESULTS_DIR: test-results-macos-latest-3.12-product-prompt-studio
      FROZEN_SOURCE: b38c9f725748c5addd5ed44f7526bea55ee7621a
    steps:
    - name: Checkout diagnostic observer
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Copy observer before frozen checkout
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/pr2979-native-observation"
        cp Helper_Scripts/diagnostics/pr2979_native_shutdown.py "$RUNNER_TEMP/pr2979-native-observation/"
        shasum -a 256 "$RUNNER_TEMP/pr2979-native-observation/pr2979_native_shutdown.py"
    - name: Checkout immutable published source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: b38c9f725748c5addd5ed44f7526bea55ee7621a
        persist-credentials: false
    - name: Install FFmpeg (multi-OS)
      uses: ./.github/actions/setup-ffmpeg
      with:
        install-ffmpeg: 'false'
        install-portaudio: 'true'
    - name: Setup Python and deps (with uv)
      uses: ./.github/actions/setup-python-deps
      with:
        python-version: '3.12'
        use-uv: 'true'
        enable-pip-cache: 'true'
        cache-dependency-path: |
          pyproject.toml
          uv.lock
        extras: dev
    - name: Ensure pytest-asyncio installed (OS matrix)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
    - name: Verify frozen source and record hashes
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
        git diff --exit-code "$FROZEN_SOURCE" -- .
        mkdir -p "$PROMPT_SHUTDOWN_PROBE_DIR"
        python - <<'PYCODE'
        import hashlib, json, os, pathlib, subprocess
        paths = subprocess.check_output(["git", "ls-files", "tldw_Server_API/tests/prompt_studio", "tldw_Server_API/tests/conftest.py", "pyproject.toml", ".github/workflows/ci.yml", ".github/actions/setup-ffmpeg", ".github/actions/setup-python-deps"], text=True).splitlines()
        records = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in paths}
        proof = {"source_sha": os.environ["FROZEN_SOURCE"], "source_hashes": records, "observer_sha256": hashlib.sha256((pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr2979-native-observation/pr2979_native_shutdown.py").read_bytes()).hexdigest()}
        (pathlib.Path(os.environ["PROMPT_SHUTDOWN_PROBE_DIR"]) / "source.json").write_text(json.dumps(proof, indent=2))
        print(json.dumps({"source_sha": proof["source_sha"], "hashed_files": len(records), "observer_sha256": proof["observer_sha256"]}))
        PYCODE
      env:
        PROMPT_SHUTDOWN_PROBE_DIR: ${{ runner.temp }}/pr2979-native-observation/results
    - name: Observe frozen native Prompt Studio (diagnostic only)
      shell: bash
      run: |
        mkdir -p "$RESULTS_DIR"
        export DATABASE_URL="sqlite:///./Databases/users.db"
        unset TEST_DATABASE_URL POSTGRES_TEST_DB
        # TEST_PATHS is a matrix-provided list of pytest path arguments.
        # shellcheck disable=SC2086
        python "$RUNNER_TEMP/pr2979-native-observation/pr2979_native_shutdown.py" -q --disable-warnings -p pytest_asyncio.plugin \
          -p pytest_timeout -o timeout_method=signal \
          -m "not jobs and not e2e" \
          $TEST_PATHS \
          --durations=50 \
          --junit-xml="$RESULTS_DIR/${{ env.SHARD_NAME }}.xml"
      env:
        PROMPT_SHUTDOWN_PROBE_DIR: ${{ runner.temp }}/pr2979-native-observation/results
    - name: Upload test results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: pr2979-native-prompt-observation-${{ github.run_id }}
        path: |-
          ${{ env.RESULTS_DIR }}
          ${{ runner.temp }}/pr2979-native-observation/results
