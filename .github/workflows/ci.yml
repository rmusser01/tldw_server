    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_MODE: 'true'
      DISABLE_HEAVY_STARTUP: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TLDW_TEST_NO_DOCKER: '1'
      WORKFLOWS_EGRESS_ALLOWLIST: "93.184.216.34,does-not-resolve.invalid,example.com"
      SHARD_NAME: ${{ matrix.shard.name }}
      TEST_PATHS: ${{ matrix.shard.paths }}
      RESULTS_DIR: test-results-${{ matrix.os }}-3.13-${{ matrix.shard.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install FFmpeg (multi-OS)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-portaudio: 'true'

      - name: Setup Python and deps (with uv)
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.13'
          use-uv: ${{ runner.os != 'Windows' }}
          enable-pip-cache: ${{ runner.os != 'Windows' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Ensure pytest-asyncio installed (OS matrix)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Smoke start server (single-user)
        if: matrix.shard.name == 'core-server-smoke'
        env:
          SERVER_LABEL: smoke
          AUTH_MODE: single_user
          DATABASE_URL: sqlite:///./Databases/users.db
          SINGLE_USER_API_KEY: "smoke-ci-key-12345"
          E2E_TEST_BASE_URL: "http://127.0.0.1:8000"
          PYTEST_CURRENT_TEST: "ci-smoke-release-cross-os-single::startup"
          TEST_MODE: 'true'
          DISABLE_HEAVY_STARTUP: '1'
          STARTUP_TRACE: '1'
          MCP_DEBUG: '1'
          ULTRA_MINIMAL_APP: '1'
          PRIVILEGE_METADATA_VALIDATE_ON_STARTUP: '0'
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py start

      - name: Smoke health check (Windows, 15 min)
        if: ${{ always() && matrix.shard.name == 'core-server-smoke' && runner.os == 'Windows' }}
        env:
          SERVER_LABEL: smoke
          E2E_TEST_BASE_URL: "http://127.0.0.1:8000"
          SMOKE_STARTUP_TIMEOUT_SECONDS: '900'
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py health-check

      - name: Smoke health check (non-Windows)
        if: ${{ always() && matrix.shard.name == 'core-server-smoke' && runner.os != 'Windows' }}
        env:
          SERVER_LABEL: smoke
          E2E_TEST_BASE_URL: "http://127.0.0.1:8000"
          SMOKE_STARTUP_TIMEOUT_SECONDS: '180'
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py health-check

      - name: Smoke stop server
        if: ${{ always() && matrix.shard.name == 'core-server-smoke' }}
        env:
          SERVER_LABEL: smoke
        shell: bash
        run: |
          python tldw_Server_API/tests/scripts/server_lifecycle.py stop || true

      - name: Cache embedding models
        if: ${{ github.event_name != 'workflow_dispatch' && (matrix.shard.name == 'ai-chromadb' || matrix.shard.name == 'ai-chunking-core' || matrix.shard.name == 'ai-chunking-templates' || matrix.shard.name == 'ai-chunking-code-json-xml' || matrix.shard.name == 'ai-chunking-semantic-security' || matrix.shard.name == 'ai-embeddings-core' || matrix.shard.name == 'ai-embeddings-dlq-config' || matrix.shard.name == 'ai-embeddings-jobs-runtime' || matrix.shard.name == 'ai-embeddings-policy' || matrix.shard.name == 'ai-embeddings-v5-core' || matrix.shard.name == 'ai-embeddings-v5-integration' || matrix.shard.name == 'ai-embeddings-hyde-ledger' || matrix.shard.name == 'ai-embeddings-media-validation' || matrix.shard.name == 'ai-embeddings-observability' || matrix.shard.name == 'vector-stores' || matrix.shard.name == 'rag-legacy' || startsWith(matrix.shard.name, 'rag-new-') || matrix.shard.name == 'research-websearch') }}
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: models/embeddings
          key: ${{ runner.os }}-embeddings-static-v1
          restore-keys: |
            ${{ runner.os }}-embeddings-

      - name: Pre-download embedding models
        if: ${{ matrix.shard.name == 'ai-chromadb' || matrix.shard.name == 'ai-chunking-core' || matrix.shard.name == 'ai-chunking-templates' || matrix.shard.name == 'ai-chunking-code-json-xml' || matrix.shard.name == 'ai-chunking-semantic-security' || matrix.shard.name == 'ai-embeddings-core' || matrix.shard.name == 'ai-embeddings-dlq-config' || matrix.shard.name == 'ai-embeddings-jobs-runtime' || matrix.shard.name == 'ai-embeddings-policy' || matrix.shard.name == 'ai-embeddings-v5-core' || matrix.shard.name == 'ai-embeddings-v5-integration' || matrix.shard.name == 'ai-embeddings-hyde-ledger' || matrix.shard.name == 'ai-embeddings-media-validation' || matrix.shard.name == 'ai-embeddings-observability' || matrix.shard.name == 'vector-stores' || matrix.shard.name == 'rag-legacy' || startsWith(matrix.shard.name, 'rag-new-') || matrix.shard.name == 'research-websearch' }}
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          python Helper_Scripts/download_embedding_models.py --target models/embeddings
          echo "TLDW_EMBEDDING_MODELS_DIR=models/embeddings" >> "$GITHUB_ENV"

      - name: Run release OS shard tests
        shell: bash
        run: |
          mkdir -p "$RESULTS_DIR"
          export DATABASE_URL="sqlite:///./Databases/users.db"
          unset TEST_DATABASE_URL POSTGRES_TEST_DB
          pytest -q --maxfail=1 --disable-warnings -p pytest_asyncio.plugin \
            -m "not jobs and not e2e" \
            $TEST_PATHS \
            --durations=50 \
            --junit-xml="$RESULTS_DIR/${{ env.SHARD_NAME }}.xml"

      - name: Run legacy-free media checks
        if: matrix.shard.name == 'media-audio'
        shell: bash
        run: |
          export DATABASE_URL="sqlite:///./Databases/users.db"
          unset TEST_DATABASE_URL POSTGRES_TEST_DB
          TLDW_DISABLE_LEGACY_MEDIA=1 pytest -q --maxfail=1 --disable-warnings -p pytest_asyncio.plugin \
            -m "not jobs and not e2e" \
            tldw_Server_API/tests/Media \
            tldw_Server_API/tests/MediaIngestion_NEW \
            --durations=25 \
            --junit-xml="$RESULTS_DIR/media-legacy-free.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-suite-${{ matrix.os }}-py3.13-${{ matrix.shard.name }}
          path: ${{ env.RESULTS_DIR }}

  character-chat-rate-limits:
    name: Character Chat Rate-Limits (TEST_MODE=0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [full-suite-linux-312-summary, full-suite-linux-313-summary]
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_MODE: '0'
      DISABLE_HEAVY_STARTUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python and deps (uv)
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Ensure pytest-asyncio installed
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run Character_Chat rate-limit tests with TEST_MODE=0
        shell: bash
        run: |
          echo "TEST_MODE currently set to: ${TEST_MODE}"
          pytest -q --maxfail=1 --disable-warnings -p pytest_asyncio.plugin \
            tldw_Server_API/tests/Character_Chat -rs
      - name: Run Character_Chat_NEW rate-limit tests with TEST_MODE=0
        shell: bash
        run: |
          echo "TEST_MODE currently set to: ${TEST_MODE}"
          pytest -q --maxfail=1 --disable-warnings -p pytest_asyncio.plugin \
            tldw_Server_API/tests/Character_Chat_NEW -rs
