name: CI
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
concurrency:
  group: pr2979-watchlists-ubuntu-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watchlists-ubuntu-observation:
    name: UAT552 diagnostic (Ubuntu3.12, frozen landed source)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-bookworm
        env:
          POSTGRES_USER: tldw_user
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: tldw_content
        ports:
        - 5432/tcp
        options: --health-cmd "pg_isready -U tldw_user -d tldw_content" --health-interval
          10s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_MODE: 'true'
      DISABLE_HEAVY_STARTUP: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      POSTGRES_TEST_HOST: 127.0.0.1
      POSTGRES_TEST_DB: tldw_content
      POSTGRES_TEST_USER: tldw_user
      POSTGRES_TEST_PASSWORD: TestPassword123!
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: tldw_user
      TEST_DB_PASSWORD: TestPassword123!
      TEST_DB_NAME: tldw_test
      TLDW_TEST_POSTGRES_REQUIRED: '1'
      REDIS_URL: redis://127.0.0.1:6379/0
      EMBEDDINGS_REDIS_URL: redis://127.0.0.1:6379/0
      WORKFLOWS_EGRESS_ALLOWLIST: 93.184.216.34,does-not-resolve.invalid,example.com
      SHARD_NAME: product-watchlists-pipeline
      TEST_PATHS: tldw_Server_API/tests/Watchlists/test_briefing_*.py tldw_Server_API/tests/Watchlists/test_schedule_*.py
        tldw_Server_API/tests/Watchlists/test_watchlists_*.py
      RESULTS_DIR: test-results-linux-3.12-product-watchlists-pipeline
      TZ: UTC
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - name: Copy reviewed observer before frozen checkout
      shell: bash
      run: |
        cp Helper_Scripts/ci/pr2979_watchlists_observation.py "$RUNNER_TEMP/pr2979_watchlists_observation.py"
        cp .github/workflows/ci.yml "$RUNNER_TEMP/pr2979-observation-workflow.yml"
    - name: Checkout immutable landed source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 88f8b81f1efe8962e3fbbf6aa2962086fe84b087
        persist-credentials: false
        fetch-depth: 1
    - name: Install FFmpeg and PortAudio (Linux)
      uses: ./.github/actions/setup-ffmpeg
      with:
        install-ffmpeg: 'false'
        install-portaudio: 'true'
    - name: Setup Python and deps (with uv)
      uses: ./.github/actions/setup-python-deps
      with:
        python-version: '3.12'
        use-uv: 'true'
        enable-pip-cache: 'true'
        cache-dependency-path: |
          pyproject.toml
          uv.lock
        extras: dev,multiplayer
    - name: Install pg client and wait for PG
      uses: ./.github/actions/wait-for-postgres
      with:
        host: 127.0.0.1
        port: ${{ job.services.postgres.ports['5432'] }}
        user: tldw_user
    - name: Export PG env vars
      shell: bash
      run: |
        PORT="${{ job.services.postgres.ports['5432'] }}"
        DB_USER="${POSTGRES_TEST_USER:-tldw_user}"
        DB_PASSWORD="${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD is required}"
        DB_NAME="${POSTGRES_TEST_DB:-tldw_content}"
        DB_URL="postgresql://${DB_USER}:${DB_PASSWORD}@127.0.0.1:${PORT}/${DB_NAME}"
        echo "::add-mask::${DB_PASSWORD}"
        echo "::add-mask::${DB_URL}"
        {
          echo "POSTGRES_TEST_PORT=${PORT}"
          echo "TEST_DB_PORT=${PORT}"
          echo "TEST_DATABASE_URL=${DB_URL}"
          echo "DATABASE_URL=${DB_URL}"
        } >> "$GITHUB_ENV"
    - name: Ensure base DB exists
      shell: bash
      env:
        PGPASSWORD: ${{ env.POSTGRES_TEST_PASSWORD }}
      run: |
        PORT="${{ job.services.postgres.ports['5432'] }}"
        DB_NAME="${POSTGRES_TEST_DB:-tldw_content}"
        DB_USER="${POSTGRES_TEST_USER:-tldw_user}"
        psql -h 127.0.0.1 -p "$PORT" -U "$DB_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" | grep -q 1 || \
          psql -h 127.0.0.1 -p "$PORT" -U "$DB_USER" -d postgres -c "CREATE DATABASE ${DB_NAME}"
    - name: Install additional deps for PG tests
      run: |
        python -m pip install --upgrade pip
        pip install "psycopg[binary]>=3.1" pytest pytest-asyncio
    - name: Verify pytest plugins import
      shell: bash
      run: |
        python - <<'PY'
        import importlib
        import pytest_asyncio
        importlib.import_module('pytest_asyncio.plugin')
        importlib.import_module('pytest_benchmark.plugin')
        print('pytest_asyncio OK:', getattr(pytest_asyncio, '__version__', 'unknown'))
        print('pytest-benchmark OK')
        PY
    - name: Bind frozen source and reviewed observer
      shell: bash
      run: |
        python - <<'PY'
        import glob, hashlib, json, os, pathlib, platform, subprocess
        root = pathlib.Path.cwd()
        assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == "88f8b81f1efe8962e3fbbf6aa2962086fe84b087"
        assert not subprocess.check_output(["git", "diff", "--name-only"]).strip()
        helper = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr2979_watchlists_observation.py"
        assert hashlib.sha256(helper.read_bytes()).hexdigest() == "0174a0079399e6cc2971d834ecc502f25b6073ecc677238a98c88dcd3059c565"
        paths = {"pyproject.toml", ".github/workflows/ci.yml", "tldw_Server_API/tests/conftest.py", "tldw_Server_API/app/core/DB_Management/Watchlists_DB.py", "tldw_Server_API/app/api/v1/endpoints/watchlists.py", ".github/actions/setup-python-deps/action.yml", ".github/actions/setup-ffmpeg/action.yml", ".github/actions/wait-for-postgres/action.yml"}
        for pattern in os.environ["TEST_PATHS"].split(): paths.update(glob.glob(pattern))
        record = {"tested_commit": "88f8b81f1efe8962e3fbbf6aa2962086fe84b087", "observer_sha256": hashlib.sha256(helper.read_bytes()).hexdigest(), "workflow_sha256": hashlib.sha256((helper.parent / "pr2979-observation-workflow.yml").read_bytes()).hexdigest(), "python": platform.python_version(), "system": platform.system(), "source_hashes": {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in sorted(paths)}}
        pathlib.Path(os.environ["RESULTS_DIR"]).mkdir(exist_ok=True)
        (pathlib.Path(os.environ["RESULTS_DIR"]) / "observation-source.json").write_text(json.dumps(record, indent=2))
        PY
      id: bind_source
    - name: Run shard tests
      shell: bash
      run: |
        mkdir -p "$RESULTS_DIR"
        export PYTHONPATH="${PYTHONPATH}:$RUNNER_TEMP"
        export UAT552_PROBE_OUTPUT="$RESULTS_DIR/watchlists-observation"
        export DATABASE_URL="sqlite:///./Databases/users.db"
        unset TEST_DATABASE_URL POSTGRES_TEST_DB
        # A step only ends once its output pipe closes. A process a test leaves
        # running would inherit that pipe and hold the step open until the job
        # limit, which discards the log (core-security: 3 runs). So pytest writes
        # to a file that is printed afterwards, and any survivors are listed.
        # timeout + SIGABRT + PYTHONFAULTHANDLER: a hang outside a single test
        # (which pytest-timeout cannot see) dumps every thread's stack.
        PYTEST_LOG="$RESULTS_DIR/${SHARD_NAME}-pytest.log"
        set +e
        # TEST_PATHS retains the original pipeline shard arguments.
        # shellcheck disable=SC2086
        PYTHONFAULTHANDLER=1 timeout --signal=ABRT --kill-after=60s 55m \
          pytest -q --disable-warnings -p pytest_asyncio.plugin \
          -p pytest_timeout -p pr2979_watchlists_observation -o timeout_method=signal \
          -m "not jobs and not e2e" \
          $TEST_PATHS \
          --durations=50 \
          --junit-xml="$RESULTS_DIR/${SHARD_NAME}.xml" \
          > "$PYTEST_LOG" 2>&1
        status=$?
        set -e
        echo "pytest exit status ${status}; output $(wc -c < "$PYTEST_LOG") bytes"
        # Bounded, in case a runaway test flooded the output.
        tail -c 2000000 "$PYTEST_LOG"
        echo "::group::Processes still running after pytest"
        ps -eo pid,ppid,etime,args --sort=start_time | tail -n 40
        echo "::endgroup::"
        exit "$status"
    - name: Verify frozen source after tests
      if: ${{ always() && steps.bind_source.outcome == 'success' }}
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, json, os, pathlib
        root = pathlib.Path.cwd()
        results = root / os.environ["RESULTS_DIR"]
        source = json.loads((results / "observation-source.json").read_text())
        unchanged = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() == digest for p, digest in source["source_hashes"].items()}
        (results / "observation-source-after.json").write_text(json.dumps({"source_unchanged": unchanged}, indent=2))
        assert all(unchanged.values()), "frozen-source binding changed during diagnostic"
        PY
    - name: Upload test results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: pr2979-uat552-ubuntu-observation
        path: ${{ env.RESULTS_DIR }}
