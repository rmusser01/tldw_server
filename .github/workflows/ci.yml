name: PR2979 Windows Personal Context relay observation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pr2979-uat558-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
jobs:
  windows-personal-context-observation:
    name: UAT558 Windows 3.12 original Notes/Persona observation
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TEST_MODE: 'true'
      DISABLE_HEAVY_STARTUP: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TLDW_TEST_NO_DOCKER: '1'
      WORKFLOWS_EGRESS_ALLOWLIST: 93.184.216.34,does-not-resolve.invalid,example.com
      SHARD_NAME: product-notes-persona
      TEST_PATHS: tldw_Server_API/tests/Notes tldw_Server_API/tests/Notes_NEW tldw_Server_API/tests/Persona tldw_Server_API/tests/Personalization
      RESULTS_DIR: test-results-windows-latest-3.12-product-notes-persona
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Retain reviewed observation outside frozen checkout
      shell: bash
      run: |
        cp "Helper_Scripts/ci/pr2979_personal_context_relay_observation.py" "$RUNNER_TEMP/pr2979_personal_context_relay_observation.py"
        cp .github/workflows/ci.yml "$RUNNER_TEMP/uat558-workflow.yml"
    - name: Checkout immutable landed server
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 88f8b81f1efe8962e3fbbf6aa2962086fe84b087
        persist-credentials: false
    - name: Install FFmpeg (multi-OS)
      uses: ./.github/actions/setup-ffmpeg
      with:
        install-ffmpeg: 'false'
        install-portaudio: 'true'
    - name: Setup Python and deps (with uv)
      uses: ./.github/actions/setup-python-deps
      with:
        python-version: '3.12'
        use-uv: 'false'
        enable-pip-cache: 'false'
        cache-dependency-path: |
          pyproject.toml
          uv.lock
        extras: dev
    - name: Ensure pytest-asyncio installed (OS matrix)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
    - name: Bind frozen source and reviewed observer
      id: source_binding
      shell: bash
      run: |
        python - <<'PYCODE'
        import hashlib, json, os, subprocess
        from pathlib import Path
        root=Path.cwd().resolve()
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == '88f8b81f1efe8962e3fbbf6aa2962086fe84b087'
        paths=['pyproject.toml','pytest.ini','tldw_Server_API/tests/conftest.py',
         'tldw_Server_API/app/core/Sync/v2/personal_context_relay.py',
         'tldw_Server_API/app/core/Personalization/personal_context_publication.py',
         'tldw_Server_API/tests/Notes','tldw_Server_API/tests/Notes_NEW',
         'tldw_Server_API/tests/Persona','tldw_Server_API/tests/Personalization',
         '.github/actions/setup-ffmpeg','.github/actions/setup-python-deps']
        files=subprocess.check_output(['git','ls-files','-z','--',*paths]).decode().split('\0')
        source={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files if p}
        result=root/os.environ['RESULTS_DIR']; result.mkdir(parents=True,exist_ok=True)
        runner=Path(os.environ['RUNNER_TEMP'])
        source_doc={'tested_head':'88f8b81f1efe8962e3fbbf6aa2962086fe84b087','source_sha256':source,
         'helper_sha256':hashlib.sha256((runner/'pr2979_personal_context_relay_observation.py').read_bytes()).hexdigest(),
         'workflow_sha256':hashlib.sha256((runner/'uat558-workflow.yml').read_bytes()).hexdigest()}
        (result/'observation-source.json').write_text(json.dumps(source_doc,indent=2),encoding='utf-8')
        with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
         f.write('PYTHONPATH='+os.environ['PYTHONPATH']+os.pathsep+str(runner)+'\n')
         f.write('UAT558_PROBE_OUTPUT='+str(result/'relay-observation')+'\n')
        PYCODE
    - name: Run OS shard tests
      shell: bash
      run: |
        mkdir -p "$RESULTS_DIR"
        export DATABASE_URL="sqlite:///./Databases/users.db"
        unset TEST_DATABASE_URL POSTGRES_TEST_DB
        EXTRA_PYTEST_ARGS=()
        if [ "$SHARD_NAME" = "research-websearch" ]; then
          EXTRA_PYTEST_ARGS=(-vv -p pytest_timeout --timeout=120 --timeout-method=thread)
        fi
        # TEST_PATHS is a matrix-provided list of pytest path arguments.
        # shellcheck disable=SC2086
        pytest -q --disable-warnings -p pytest_asyncio.plugin -p pr2979_personal_context_relay_observation \
          "${EXTRA_PYTEST_ARGS[@]}" \
          -m "not jobs and not e2e" \
          $TEST_PATHS \
          --durations=50 \
          --junit-xml="$RESULTS_DIR/${{ env.SHARD_NAME }}.xml"
    - name: Verify frozen source after original tests
      if: always() && steps.source_binding.outcome == 'success'
      shell: bash
      run: |
        python - <<'PYCODE'
        import hashlib, json, os, subprocess
        from pathlib import Path
        root=Path.cwd().resolve(); result=root/os.environ['RESULTS_DIR']
        before=json.loads((result/'observation-source.json').read_text(encoding='utf-8'))
        source={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in before['source_sha256']}
        after={'tested_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_sha256':source}
        (result/'observation-source-after.json').write_text(json.dumps(after,indent=2),encoding='utf-8')
        assert after['tested_head'] == before['tested_head'] and source == before['source_sha256']
        PYCODE
    - name: Upload test results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: pr2979-uat558-windows-observation
        path: ${{ env.RESULTS_DIR }}
