name: UX Regression Nightly

# Red-first reproductions of verified /notes and /chat UX defects (#3125).
# The live-tier runner starts an isolated backend, the mock LLM and the web UI
# itself, so this job only installs dependencies and runs one command.
# Non-blocking for now; promote to a PR gate once it has been green for a week.

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-regression-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ux-regression:
    name: UX regression reproductions (isolated live backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install workspace dependencies
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Setup Python and server dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Run UX regression reproductions
        working-directory: apps/tldw-frontend
        run: bun run e2e:ux-regression -- --run-id="ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload UX regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ux-regression-nightly-artifacts
          if-no-files-found: ignore
          path: |
            apps/tldw-frontend/test-results/**
