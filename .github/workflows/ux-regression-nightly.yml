name: UX Regression Nightly

# Red-first reproductions of verified /notes and /chat UX defects (#3125).
# The live-tier runner starts an isolated backend, the mock LLM and the web UI
# itself, so this job only installs dependencies and runs one command.
#
# Pull requests are covered by the path-scoped `ux-regression` job in
# frontend-e2e-tiers.yml. GitHub runs a scheduled workflow only from the
# default branch and offers dispatch only for workflows that exist there, so
# this file does nothing until it reaches `main`. From then on it adds a
# daily run of main's code that ignores path scoping.
# Non-blocking for now; promote to a PR gate once it has been green for a week.

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-regression-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ux-regression:
    name: UX regression reproductions (isolated live backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"

      - name: Install workspace dependencies
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      # PyAudio is a core dependency with no Linux wheel; its source build
      # needs the PortAudio headers.
      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: "false"
          install-portaudio: "true"

      - name: Setup Python and server dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Run UX regression reproductions
        working-directory: apps/tldw-frontend
        run: bun run e2e:ux-regression -- --run-id="ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload UX regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ux-regression-nightly-artifacts
          if-no-files-found: ignore
          path: |
            apps/tldw-frontend/test-results/**
