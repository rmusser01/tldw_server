name: tldw-server PyPI Package Check

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      qualification:
        description: Install the checked wheel and produce a release verdict
        type: boolean
        default: false
    outputs:
      checked:
        description: The release package build and install passed
        value: ${{ jobs.build-and-check.outputs.checked }}

permissions:
  contents: read

concurrency:
  group: pypi-package-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}${{ inputs.qualification && format('-qualification-{0}', github.workflow) || '' }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: pypi-package.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  build-and-check:
    name: Build and Validate Distributions
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checked: ${{ steps.install.outputs.checked }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ (inputs.qualification && github.sha) || needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel loguru

      - name: Build and check package
        run: make pypi-check

      - name: Install PortAudio build dependencies
        if: inputs.qualification
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Install and import the built wheel
        id: install
        if: inputs.qualification
        shell: bash
        env:
          LICENSE: ${{ github.event_name != 'pull_request' || (needs.await_license.result == 'success' && needs.await_license.outputs.license_passed == 'true') }}
        run: |
          set -euo pipefail
          [[ "$LICENSE" == true ]]
          python -m venv "$RUNNER_TEMP/tldw-wheel"
          wheel_python="$RUNNER_TEMP/tldw-wheel/bin/python"
          "$wheel_python" -m pip install dist/*.whl
          "$wheel_python" -m pip check
          "$wheel_python" -I -c 'import tldw_Server_API'
          echo 'checked=true' >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.qualification && 'tldw-server-qualified-dist' || 'tldw-server-pypi-dist' }}
          path: dist/*
          if-no-files-found: error
