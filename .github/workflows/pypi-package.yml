name: tldw-server PyPI package check

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - pyproject.toml
      - uv.lock
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-package-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.12.7@sha256:95f2aa1fe59274951cfe9b0cbc7972e879ff1004bc8945d130a32eb0dbd85945

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: pypi-package.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  build:
    name: Build and validate distributions
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install pinned uv
        shell: bash
        run: |
          set -euo pipefail
          uv_container="$(docker create --platform linux/amd64 "$UV_IMAGE")"
          trap 'docker rm -f "$uv_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$uv_container:/uv" "$RUNNER_TEMP/uv"
          docker rm "$uv_container"
          trap - EXIT
          sudo install -m 0755 "$RUNNER_TEMP/uv" /usr/local/bin/uv
          uv --version | grep -Eq '^uv 0\.12\.7 '

      - name: Sync locked release tools
        run: uv sync --locked --only-group release

      - name: Build and check package
        run: >-
          PYTHON=.venv/bin/python PYPI_BUILD_ARGS=--no-isolation
          make pypi-check

      - name: Hash checked distributions
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
            test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
            find . -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
