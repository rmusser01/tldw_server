name: PyPI Package Check

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - pyproject.toml
      - README.md
      - .github/tests/**
      - mcp_unified/**
      - tldw_Server_API/**
      - .github/workflows/pypi-package.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - README.md
      - .github/tests/**
      - mcp_unified/**
      - tldw_Server_API/**
      - .github/workflows/pypi-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and Validate Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use stable major-tag pins consistently in this workflow for predictable updates.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel
          pip install -e "mcp_unified[dev]"

      - name: Validate MCP Unified standalone artifacts
        run: |
          python -m pytest \
            -c mcp_unified/pytest-artifact-gate.ini \
            .github/tests/test_mcp_unified_artifact_gate.py::test_mcp_unified_standalone_distribution_metadata_matches_extras \
            .github/tests/test_mcp_unified_artifact_gate.py::test_mcp_unified_standalone_sdist_contains_only_package_boundary \
            .github/tests/test_mcp_unified_artifact_gate.py::test_mcp_unified_standalone_artifacts_include_typed_marker \
            -q

      - name: Build and check package
        run: make pypi-check

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*
          if-no-files-found: error
