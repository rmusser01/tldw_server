name: tldw-server PyPI Package Check

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - pyproject.toml
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - README.md
      - Makefile
      - tldw_Server_API/**
      - Helper_Scripts/Packaging/**
      - .github/workflows/pypi-package.yml
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-package-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: pypi-package.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  build-and-check:
    name: Build and Validate Distributions
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel loguru

      - name: Build and check package
        run: make pypi-check

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tldw-server-pypi-dist
          path: dist/*
          if-no-files-found: error
