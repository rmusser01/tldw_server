name: License First Admission

on:
  workflow_call:
    inputs:
      workflow_file:
        description: Caller workflow filename used for conservative path routing
        required: true
        type: string
    outputs:
      pr_number:
        description: Validated pr number
        value: ${{ jobs.admission.outputs.pr_number }}
      head_sha:
        description: Validated head sha
        value: ${{ jobs.admission.outputs.head_sha }}
      base_sha:
        description: Validated base sha
        value: ${{ jobs.admission.outputs.base_sha }}
      base_ref:
        description: Validated base ref
        value: ${{ jobs.admission.outputs.base_ref }}
      should_run:
        description: Validated should run
        value: ${{ jobs.admission.outputs.should_run }}

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.admit.outputs.pr_number }}
      head_sha: ${{ steps.admit.outputs.head_sha }}
      base_sha: ${{ steps.admit.outputs.base_sha }}
      base_ref: ${{ steps.admit.outputs.base_ref }}
      should_run: ${{ steps.admit.outputs.should_run }}
    steps:
      - name: Checkout trusted admission source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - id: admit
        name: Validate trusted run and route caller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]

          workflow_json="${RUNNER_TEMP}/license-first-workflow.json"
          pull_json="${RUNNER_TEMP}/license-first-pull.json"
          combined_status_json="${RUNNER_TEMP}/license-first-combined-status.json"
          file_pages_json="${RUNNER_TEMP}/license-first-file-pages.json"

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/frontend-license-gate.yml" > "${workflow_json}"
          pr_number="$(jq -er '
            .workflow_run.pull_requests
            | select(type == "array" and length == 1)
            | .[0].number
            | select(type == "number" and . > 0 and . == floor)
            | tostring
            | select(test("^[1-9][0-9]*$"))
          ' "${GITHUB_EVENT_PATH}")"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${pull_json}"
          head_sha="$(jq -er '
            .head.sha
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' "${pull_json}")"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" > "${combined_status_json}"

          if gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" > "${file_pages_json}"; then
            files_complete=true
          else
            printf '[]\n' > "${file_pages_json}"
            files_complete=false
          fi

          python3 Helper_Scripts/ci/license_first_admission.py --event "${GITHUB_EVENT_PATH}" --workflow "${workflow_json}" --pull "${pull_json}" --combined-status "${combined_status_json}" --file-pages "${file_pages_json}" --workflow-file "${WORKFLOW_FILE}" --routes ".github/license-first-paths.json" --files-complete "${files_complete}" --github-output "${GITHUB_OUTPUT}"
