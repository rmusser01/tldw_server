name: MCP Unified Internal RC

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - apps/mcp-unified/**
      - Makefile
      - Helper_Scripts/mcp_unified_rc.py
      - Helper_Scripts/Testing-related/mcp_standalone_user_guide_uat.py
      - .github/tests/test_mcp_unified_artifact_gate.py
      - tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_connection.py
      - tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_contracts.py
      - tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_stdio.py
      - tldw_Server_API/app/core/MCP_unified/tests/test_runtime_package_boundary.py
      - tldw_Server_API/app/core/MCP_unified/tests/test_mcp_unified_rc_harness.py
      - .github/workflows/mcp-unified-rc.yml
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-unified-rc-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: mcp-unified-rc.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  internal-rc:
    name: Build, install, and UAT standalone MCP package
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine setuptools wheel pytest pytest-asyncio bandit
          python -m pip install "pydantic>=2.0.0" "loguru>=0.7.0" "PyYAML>=6.0.0" "httpx>=0.24.0" "websockets>=12.0"

      - name: Run internal RC
        run: make mcp-unified-rc

      - name: Upload MCP Unified RC artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-unified-rc
          path: .artifacts/mcp-unified-rc/**
          if-no-files-found: error

  portable-stdio:
    name: Portable stdio (${{ matrix.os }})
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install standalone base and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./apps/mcp-unified[dev]"

      - name: Run installed protocol and portable stdio contracts
        run: >-
          python -m pytest
          -c apps/mcp-unified/pyproject.toml
          --noconftest
          tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_contracts.py
          tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_connection.py
          tldw_Server_API/app/core/MCP_unified/tests/test_gateway_protocol_stdio.py
          -q
