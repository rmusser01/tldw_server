name: Frontend E2E Tiers

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/packages/ui/src/**'
      - 'apps/tldw-frontend/**'
      - 'tldw_Server_API/**'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run (critical, features, admin, journeys, all-tiers)'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - features
          - admin
          - journeys
          - all-tiers

permissions:
  contents: read

env:
  SKIP_WXT_PREPARE: '1'

concurrency:
  group: frontend-e2e-tiers-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: frontend-e2e-tiers.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # ── Tier 1 + Journeys (critical path — always runs on PR) ─────────────
  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  critical:
    name: E2E Critical (Tier 1 + Journeys)
    needs: [admission, await_license]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      ) &&
      (
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_run') ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJSON('["critical","all-tiers"]'), github.event.inputs.tier))
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_CMD: 'bun run start -- -p 8080 > ../../.tmp/frontend-e2e/frontend.log 2>&1'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      # Real application APIs, with only downstream inference controlled in CI.
      TLDW_LIVE_TIER_UAT: '1'
      TLDW_E2E_ALLOW_OFFLINE: '0'
      TLDW_UAT390_MODE: deterministic
      TLDW_UAT390_PROVIDER: openai
      TLDW_UAT390_MODEL: gpt-4.1-mini
      TLDW_E2E_CHARACTER_PROVIDER_FAILURE_MODEL: tldw:openai:gpt-4.1-mini
      # Parallel journeys share one principal; retain a finite CI-only budget.
      RG_POLICY_PATH: .tmp/frontend-e2e/resource-governor-policies.yaml
      UAT_CHARACTER_MODE: deterministic
      UAT_CHARACTER_PROVIDER: openai
      UAT_CHARACTER_MODEL: gpt-4.1-mini
      UAT_PROMPT_MODE: deterministic
      UAT_PROMPT_PROVIDER: openai
      UAT_PROMPT_MODEL: gpt-4.1-mini
      UAT_STUDY_PROVIDER: openai
      UAT_STUDY_MODEL: gpt-4.1-mini
      DEFAULT_LLM_PROVIDER: openai
      OPENAI_API_KEY: sk-ci-controlled-downstream-key
      OPENAI_API_BASE_URL: http://127.0.0.1:8101/v1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start deterministic downstream provider
        run: |
          mkdir -p .tmp/frontend-e2e
          python mock_openai_server/run_server.py \
            --config apps/tldw-frontend/e2e/onboarding-uat/mock-openai/configs/ci-journeys.json \
            --host 127.0.0.1 --port 8101 > .tmp/frontend-e2e/provider.log 2>&1 &
          provider_pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$provider_pid" 2>/dev/null; then
              cat .tmp/frontend-e2e/provider.log
              exit 1
            fi
            if curl -sf -H "Authorization: Bearer $OPENAI_API_KEY" http://127.0.0.1:8101/v1/models > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .tmp/frontend-e2e/provider.log
          exit 1

      - name: Configure shared browser-test request budget
        run: |
          mkdir -p .tmp/frontend-e2e
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          policies = yaml.safe_load(Path("tldw_Server_API/Config_Files/resource_governor_policies.yaml").read_text())
          policies["policies"]["character_chat.default"]["requests"]["rpm"] = 600
          Path(os.environ["RG_POLICY_PATH"]).write_text(yaml.safe_dump(policies))
          PY

      - name: Start backend server
        run: |
          mkdir -p .tmp/frontend-e2e
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 127.0.0.1 --port 8000 > .tmp/frontend-e2e/backend.log 2>&1 &
          backend_pid=$!
          for _ in $(seq 1 90); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              tail -n 100 .tmp/frontend-e2e/backend.log
              exit 1
            fi
            if curl -sf -H "X-API-KEY: $SINGLE_USER_API_KEY" http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 .tmp/frontend-e2e/backend.log
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: |
          bunx playwright install --with-deps chromium
          python -m playwright install --with-deps chromium

      - name: Build frontend for browser tests
        shell: bash
        working-directory: apps/tldw-frontend
        run: bun run build:dev 2>&1 | tee ../../.tmp/frontend-e2e/frontend-build.log

      - name: Run critical E2E tests
        working-directory: apps/tldw-frontend
        timeout-minutes: 20
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: bun run e2e:critical --reporter=list,json --retries=0 --trace=retain-on-failure

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-results
          include-hidden-files: true
          path: |
            apps/tldw-frontend/test-results/
            .tmp/frontend-e2e/
          retention-days: 7

  # ── Tier 2 + 3 (features — on dispatch or full suite) ─────────────────
  features:
    name: E2E Features (Tier 2 + 3)
    needs: [admission, await_license]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["features","all-tiers"]'), github.event.inputs.tier)
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start backend server
        run: |
          mkdir -p .tmp/frontend-e2e
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 127.0.0.1 --port 8000 > .tmp/frontend-e2e/backend.log 2>&1 &
          backend_pid=$!
          for _ in $(seq 1 90); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              tail -n 100 .tmp/frontend-e2e/backend.log
              exit 1
            fi
            if curl -sf -H "X-API-KEY: $SINGLE_USER_API_KEY" http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 .tmp/frontend-e2e/backend.log
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run feature E2E tests
        working-directory: apps/tldw-frontend
        run: bun run e2e:features --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-features-results
          path: apps/tldw-frontend/test-results/
          retention-days: 7

  # ── Tier 4 + 5 (admin/specialized — on dispatch or full suite) ────────
  admin:
    name: E2E Admin (Tier 4 + 5)
    needs: [admission, await_license]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["admin","all-tiers"]'), github.event.inputs.tier)
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start backend server
        run: |
          mkdir -p .tmp/frontend-e2e
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 127.0.0.1 --port 8000 > .tmp/frontend-e2e/backend.log 2>&1 &
          backend_pid=$!
          for _ in $(seq 1 90); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              tail -n 100 .tmp/frontend-e2e/backend.log
              exit 1
            fi
            if curl -sf -H "X-API-KEY: $SINGLE_USER_API_KEY" http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 .tmp/frontend-e2e/backend.log
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run admin E2E tests
        working-directory: apps/tldw-frontend
        run: bun run e2e:admin --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-admin-results
          path: apps/tldw-frontend/test-results/
          retention-days: 7

  # ── UX regression (notes/chat — PRs that touch them, or all-tiers) ────
  # Red-first reproductions of verified /notes and /chat defects (#3125). The
  # live-tier runner starts its own isolated backend, mock LLM and web UI, so
  # this job needs no services. It is advisory: the dev ruleset does not
  # require it and no required gate reads it. ux-regression-nightly.yml cannot
  # stand in for it, because GitHub reads scheduled workflows from the
  # default branch only.
  ux-regression:
    name: E2E UX Regression (notes/chat)
    needs: [admission, await_license]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      ) &&
      (
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_run') ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.tier == 'all-tiers')
      )
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Skip the expensive run unless the change can affect /notes or /chat.
      # pull_request: diff GitHub's test-merge commit against its first parent,
      # which is exactly this PR's change set even when the branch is behind
      # dev. Admitted workflow_run: the audited base/head pair. Manual
      # dispatch has nothing to diff and always runs. If the diff cannot be
      # computed, run rather than skip.
      - name: Detect notes/chat UX changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          ADMITTED_BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          ADMITTED_HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from_ref="${MERGE_SHA}^1"
            to_ref="$MERGE_SHA"
            fetch_args=(--depth=2 origin "$MERGE_SHA")
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            from_ref="$ADMITTED_BASE_SHA"
            to_ref="$ADMITTED_HEAD_SHA"
            fetch_args=(--depth=1 origin "$ADMITTED_BASE_SHA" "$ADMITTED_HEAD_SHA")
          else
            echo "Manual dispatch: running the UX regression suite without a path check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/ux-regression-changed-files.txt"
          if git fetch --no-tags "${fetch_args[@]}" \
            && git diff --name-only "$from_ref" "$to_ref" > "$changed_files"; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                apps/packages/ui/src/components/Notes/* | \
                apps/packages/ui/src/components/Option/Playground/* | \
                apps/packages/ui/src/components/Sidepanel/* | \
                apps/packages/ui/src/components/Common/* | \
                apps/packages/ui/src/hooks/* | \
                apps/packages/ui/src/services/* | \
                apps/packages/ui/src/db/* | \
                apps/packages/ui/src/store/* | \
                apps/packages/ui/src/routes/option-notes.tsx | \
                apps/packages/ui/src/routes/option-chat.tsx | \
                apps/tldw-frontend/pages/notes.tsx | \
                apps/tldw-frontend/pages/chat/* | \
                apps/tldw-frontend/e2e/ux-regression/* | \
                apps/tldw-frontend/e2e/utils/* | \
                apps/tldw-frontend/scripts/live-tier-uat/* | \
                apps/tldw-frontend/playwright.config.ts | \
                tldw_Server_API/app/api/v1/endpoints/notes*.py | \
                tldw_Server_API/app/api/v1/endpoints/chat*.py | \
                tldw_Server_API/app/api/v1/endpoints/character_chat*.py | \
                tldw_Server_API/app/core/DB_Management/* | \
                .github/workflows/frontend-e2e-tiers.yml)
                  run=true
                  echo "Notes/chat UX path changed: $file"
                  ;;
              esac
            done < "$changed_files"
            if [[ "$run" == "false" ]]; then
              echo "::notice title=UX regression skipped::No notes/chat UX paths changed."
            fi
          else
            echo "::warning title=UX regression scope unknown::Could not diff the change; running the suite."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg and PortAudio (Linux)
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Setup Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run UX regression reproductions
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/tldw-frontend
        timeout-minutes: 30
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run e2e:ux-regression -- --run-id="$RUN_ID"

      # Live-tier evidence is under test-results/live-tier-uat/<run-id>/;
      # Playwright's failure screenshots and videos sit beside it.
      - name: Upload UX regression artifacts
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-ux-regression-results
