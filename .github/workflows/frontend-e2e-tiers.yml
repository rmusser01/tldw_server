name: Frontend E2E Tiers

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/packages/ui/src/**'
      - 'apps/tldw-frontend/**'
      - 'tldw_Server_API/**'
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run (critical, features, admin, journeys, all-tiers)'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - features
          - admin
          - journeys
          - all-tiers

permissions:
  contents: read

env:
  SKIP_WXT_PREPARE: '1'

concurrency:
  group: frontend-e2e-tiers-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: frontend-e2e-tiers.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # ── Tier 1 + Journeys (critical path — always runs on PR) ─────────────
  critical:
    name: E2E Critical (Tier 1 + Journeys)
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      ) &&
      (
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_run') ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJSON('["critical","all-tiers"]'), github.event.inputs.tier))
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      TLDW_CONFIG_FILE: tldw_Server_API/Config_Files/e2e-critical-config.txt
      DEFAULT_LLM_PROVIDER: openai
      OPENAI_API_KEY: sk-uat-mock-openai
      OPENAI_API_BASE_URL: http://127.0.0.1:5000/v1
      CUSTOM_OPENAI_API_IP: http://127.0.0.1:5000/v1
      CUSTOM_OPENAI_API_KEY: sk-uat-mock-openai
      CUSTOM_OPENAI_API_MODEL: local-uat-chat
      TLDW_E2E_CHARACTER_CALLABLE_MODEL: tldw:custom-openai-api:local-uat-chat
      # CI-only relaxation: the real Watchlist journey fetches a tracked fixture
      # from the local WebUI. The localhost suffix allowlist remains subject to
      # the production default port allowlist.
      WORKFLOWS_EGRESS_ALLOWLIST: localhost
      WORKFLOWS_EGRESS_BLOCK_PRIVATE: 'false'
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start deterministic mock OpenAI provider
        working-directory: apps/tldw-frontend/e2e/onboarding-uat/mock-openai
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}/mock_openai_server${PYTHONPATH:+:${PYTHONPATH}}" \
            python -m mock_openai.server --config configs/local-success.json \
              --host 127.0.0.1 --port 5000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/health

      - name: Start backend server
        run: |
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 0.0.0.0 --port 8000 &
          # Wait for server to be ready
          for _ in $(seq 1 30); do
            curl -sf -H "X-API-KEY: ${SINGLE_USER_API_KEY}" http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -sf -H "X-API-KEY: ${SINGLE_USER_API_KEY}" http://127.0.0.1:8000/api/v1/health

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run critical E2E tests
        working-directory: apps/tldw-frontend
        run: bun run e2e:critical --reporter=list
        continue-on-error: true
        id: e2e_critical

      - name: Retry critical E2E tests
        if: steps.e2e_critical.outcome == 'failure'
        working-directory: apps/tldw-frontend
        run: bun run e2e:critical --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-results
          path: apps/tldw-frontend/test-results/
          retention-days: 7

  # ── Tier 2 + 3 (features — on dispatch or full suite) ─────────────────
  features:
    name: E2E Features (Tier 2 + 3)
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      ) &&
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["features","all-tiers"]'), github.event.inputs.tier)
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      TEST_MODE: '1'
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start backend server
        run: |
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 0.0.0.0 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run feature E2E tests
        working-directory: apps/tldw-frontend
        run: bun run e2e:features --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-features-results
          path: apps/tldw-frontend/test-results/
          retention-days: 7

  # ── Tier 4 + 5 (admin/specialized — on dispatch or full suite) ────────
  admin:
    name: E2E Admin (Tier 4 + 5)
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      ) &&
      (
        github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["admin","all-tiers"]'), github.event.inputs.tier)
      )
    services:
      redis:
        image: mirror.gcr.io/library/redis:8-alpine@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: single_user
      TEST_MODE: '1'
      SINGLE_USER_API_KEY: test-api-key-for-e2e-testing-12345
      REDIS_URL: redis://127.0.0.1:6379/0
      TLDW_WEB_AUTOSTART: 'true'
      TLDW_WEB_URL: http://localhost:8080
      TLDW_SERVER_URL: http://127.0.0.1:8000
      TLDW_API_KEY: test-api-key-for-e2e-testing-12345
      NEXT_PUBLIC_TLDW_DEPLOYMENT_MODE: advanced
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and backend
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          use-uv: 'true'
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Start backend server
        run: |
          python -m uvicorn tldw_Server_API.app.main:app \
            --host 0.0.0.0 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install frontend dependencies
        working-directory: apps
        run: bun install

      - name: Install Playwright browsers
        working-directory: apps/tldw-frontend
        run: bunx playwright install --with-deps chromium

      - name: Run admin E2E tests
        working-directory: apps/tldw-frontend
        run: bun run e2e:admin --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-admin-results
          path: apps/tldw-frontend/test-results/
          retention-days: 7
