name: backend-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-required-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: backend-required.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed || steps.detect_admitted.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed || steps.detect_admitted.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed || steps.detect_admitted.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed || steps.detect_admitted.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required || steps.detect_admitted.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/detect-required-gate-changes
      - id: detect_admitted
        name: Classify admitted changed files
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES_PATH="${RUNNER_TEMP}/required-gate-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES_PATH"
          mapfile -t CHANGED_FILES < "$CHANGED_FILES_PATH"
          python -m Helper_Scripts.ci.emit_ci_gate_flags "${CHANGED_FILES[@]}"

  backend-required:
    name: backend-required
    runs-on: ubuntu-latest
    needs: [changes, admission]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      ) &&
      (
        needs.changes.result == 'success'
      )
    timeout-minutes: 30
    steps:
      - name: No-op pass (backend unchanged)
        if: needs.changes.outputs.backend_changed != 'true'
        run: echo "No backend paths changed; backend-required passed by policy."

      - name: Checkout
        if: needs.changes.outputs.backend_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Compile backend modules
        if: needs.changes.outputs.backend_changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir("tldw_Server_API/app", force=True, quiet=1)
          sys.exit(0 if ok else 1)
          PY

      - name: Type check changed backend modules
        if: needs.changes.outputs.backend_changed == 'true'
        id: mypy_changed
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ needs.admission.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ needs.admission.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "${BASE_SHA:-}" || "${BASE_SHA:-}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "${BASE_SHA:-}" ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$HEAD_SHA"
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "${RUNNER_TEMP}/backend-required-changed-files.txt"
            mapfile -t CHANGED_PY < <(grep -E '^tldw_Server_API/.*\.py$' "${RUNNER_TEMP}/backend-required-changed-files.txt" || true)
          else
            mapfile -t CHANGED_PY < <(git ls-files | grep -E '^tldw_Server_API/.*\.py$' || true)
          fi

          if [[ "${#CHANGED_PY[@]}" -eq 0 ]]; then
            echo "No backend Python files changed; skipping mypy."
            exit 0
          fi

          python -m pip install --upgrade pip
          pip install mypy
          mypy --follow-imports=silent --ignore-missing-imports "${CHANGED_PY[@]}"

      - name: Backend unit smoke
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_MODE: "true"
          DISABLE_HEAVY_STARTUP: "1"
        run: |
          pytest -q --disable-warnings -p pytest_asyncio.plugin \
            -m "unit and not e2e and not jobs" \
            tldw_Server_API/tests/unit

      # Boots the app in a DEPLOYMENT-SHAPED (scrubbed) environment — no
      # TEST_MODE, no conftest env forcing — and probes /health. Catches the
      # "passes in CI with env vars, fails in a real deployment" class (#2590/
      # e88c96500f). The script manages its own minimal child env, so no test
      # env is set at the step level.
      - name: Minimal-env startup smoke
        if: needs.changes.outputs.backend_changed == 'true'
        run: |
          python Helper_Scripts/ci/minimal_env_smoke.py --timeout 150

      # OpenAPI contract drift gate (RF1 / #2590 class): recompute the schema
      # fingerprint and fail if it drifts from the checked-in snapshot. A
      # backend Pydantic model change that alters the API without updating the
      # snapshot (and regenerating the frontend types) fails here. Runs in the
      # backend workflow because it is guaranteed to run on drift-causing PRs
      # and has the server deps installed.
      - name: OpenAPI contract drift gate
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          PYTHONPATH: .
        run: |
          python Helper_Scripts/export_openapi_schema.py \
            --check apps/tldw-frontend/lib/api/openapi.fingerprint.json
