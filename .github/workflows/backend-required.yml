name: backend-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for change detection (the merge queue passes dev's tip)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-required-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: backend-required.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed || steps.detect_admitted.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed || steps.detect_admitted.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed || steps.detect_admitted.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed || steps.detect_admitted.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required || steps.detect_admitted.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/detect-required-gate-changes
      - id: detect_admitted
        name: Classify admitted changed files
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES_PATH="${RUNNER_TEMP}/required-gate-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES_PATH"
          mapfile -t CHANGED_FILES < "$CHANGED_FILES_PATH"
          python -m Helper_Scripts.ci.emit_ci_gate_flags "${CHANGED_FILES[@]}"

  backend-required:
    name: backend-required
    runs-on: ubuntu-latest
    needs: [changes, admission, await_license]
    # This job's name is the required status check, so it must REPORT rather
    # than skip. A skipped job leaves the check unreported, and a run whose
    # jobs all skip concludes "success" -- so a failed licence audit used to
    # show green while running nothing. The last arm exists purely so a
    # negative verdict reaches the assertion step below and goes red.
    #
    # The first two arms are the `changes` job's own condition and deliberately
    # do not ask for needs.changes.result == 'success': when change detection
    # was admitted and did not succeed, this job was skipped, and GitHub counts
    # a skipped required job as satisfied. It now runs and the second step
    # fails it (TASK-13462).
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        ) ||
        (
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        )
      )
    timeout-minutes: 30
    steps:
      - name: Require the license audit to have passed
        if: >-
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        run: |
          echo "::error::License audit did not pass for this PR head, so the gates were not run. Fix the licence policy failure and re-run."
          exit 1

      # Stays directly after the license refusal and before every other step:
      # no later step uses a status function, so none runs once this has failed.
      - name: Require change detection to have succeeded
        if: needs.changes.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::Change detection (the 'changes' job) ended as '${CHANGES_RESULT}', not 'success', so this gate cannot tell what the head changed and ran nothing. Re-run the workflow."
          exit 1

      - name: No-op pass (backend unchanged)
        if: needs.changes.outputs.backend_changed != 'true'
        run: echo "No backend paths changed; backend-required passed by policy."

      - name: Checkout
        if: needs.changes.outputs.backend_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: ${{ github.event_name != 'workflow_run' }}
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: Compile backend modules
        if: needs.changes.outputs.backend_changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir("tldw_Server_API/app", force=True, quiet=1)
          sys.exit(0 if ok else 1)
          PY

      - name: Type check changed backend modules
        if: needs.changes.outputs.backend_changed == 'true'
        id: mypy_changed
        continue-on-error: true
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ needs.admission.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ needs.admission.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}"
          # A dispatch carries no pull_request payload, so without this the base
          # would be HEAD^ and only the last commit would be type-checked. The
          # merge queue passes dev's tip. Empty on every other event, and already
          # checked to be a 40-character SHA by the `changes` job.
          if [[ -n "${DISPATCH_BASE_SHA:-}" ]]; then
            BASE_SHA="$DISPATCH_BASE_SHA"
          fi
          if [[ -z "${BASE_SHA:-}" || "${BASE_SHA:-}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "${BASE_SHA:-}" ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$HEAD_SHA"
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            # --diff-filter=d: a file the PR deletes cannot be type-checked.
            git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" > "${RUNNER_TEMP}/backend-required-changed-files.txt"
            mapfile -t CHANGED_PY < <(grep -E '^tldw_Server_API/.*\.py$' "${RUNNER_TEMP}/backend-required-changed-files.txt" || true)
          else
            mapfile -t CHANGED_PY < <(git ls-files | grep -E '^tldw_Server_API/.*\.py$' || true)
          fi

          if [[ "${#CHANGED_PY[@]}" -eq 0 ]]; then
            echo "No backend Python files changed; skipping mypy."
            exit 0
          fi

          python -m pip install --upgrade pip
          pip install mypy
          mypy --follow-imports=silent --ignore-missing-imports "${CHANGED_PY[@]}"

      - name: Enforce tenant isolation ratchets
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_MODE: "true"
          DISABLE_HEAVY_STARTUP: "1"
        run: |
          pytest -q --disable-warnings -p pytest_asyncio.plugin \
            tldw_Server_API/tests/CI/test_rls_coverage_ratchet.py \
            tldw_Server_API/tests/lint/test_route_auth_ratchet.py \
            tldw_Server_API/tests/lint/test_rg_route_map_lint.py \
            tldw_Server_API/tests/lint/test_scope_predicate_ratchet.py

      # Contracts and ratchets that used to run only in ci.yml's full-suite shards,
      # which are not required and are skipped on most PRs -- how #3013 merged with
      # the license-first contracts red (TASK-13386). A ratchet nothing enforces is
      # decoration: the private-coercer ratchet (TASK-13342) and the first-party
      # source pinning (TASK-13380) need a required gate for the same reason, as do
      # the backlog task-format ratchet and backlog-py's own tests (TASK-13440,
      # ADR-059): backlog-py is the task editor, and its normalizer defines the ratchet.
      # The task-format ratchet checks only the task files this PR changed since its
      # merge base with BACKLOG_TASK_FORMAT_BASE, so it never fails a PR for a file
      # that reached dev through a backlog-only PR this gate did not run on.
      # inputs.base_sha is set only on a dispatch (the merge queue passes dev's tip).
      - name: Enforce CI contracts and code ratchets
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          BACKLOG_TASK_FORMAT_BASE: ${{ inputs.base_sha || needs.admission.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_MODE: "true"
          DISABLE_HEAVY_STARTUP: "1"
        run: |
          pytest -q --disable-warnings -p pytest_asyncio.plugin \
            tldw_Server_API/tests/CI/test_license_first_workflow_contracts.py \
            tldw_Server_API/tests/CI/test_frontend_license_gate_workflow.py \
            tldw_Server_API/tests/CI/test_merge_queue_rules.py \
            tldw_Server_API/tests/CI/test_merge_queue_actions.py \
            tldw_Server_API/tests/CI/test_merge_queue_workflow.py \
            tldw_Server_API/tests/CI/test_merge_queue_gate_workflows.py \
            tldw_Server_API/tests/CI/test_merge_queue_frontend_required.py \
            tldw_Server_API/tests/CI/test_merge_queue_license_dispatch.py \
            tldw_Server_API/tests/lint/test_private_coercion_ratchet.py \
            tldw_Server_API/tests/lint/test_first_party_source_pinning.py \
            tldw_Server_API/tests/CI/test_backlog_task_format_ratchet.py \
            tools/backlog-py/tests

      - name: Backend unit smoke
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_MODE: "true"
          DISABLE_HEAVY_STARTUP: "1"
        run: |
          pytest -q --disable-warnings -p pytest_asyncio.plugin \
            -m "unit and not e2e and not jobs" \
            tldw_Server_API/tests/unit

      # Timezone axis. Every other job and step runs on UTC, where a naive-vs-aware
      # datetime bug has a delta of exactly zero and is therefore invisible. TASK-13299
      # shipped a 7-hour error in OpenAI-compatible `created` timestamps for precisely
      # that reason, on a product whose target deployment is a user's own machine.
      #
      # This lives in the required lane deliberately. It was first added as a standalone
      # job in ci.yml, whose result is not part of protected-branch enforcement, so a
      # timestamp regression could fail it without blocking the merge — the guard was
      # decorative. `backend-required` is enforced gate 1 of 6 per
      # Docs/Development/CI_REQUIRED_GATES.md.
      - name: Confirm the runner is not on UTC
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          TZ: America/Los_Angeles
        shell: bash
        run: |
          set -euo pipefail
          OFFSET="$(python -c 'import time; print(time.strftime("%z"))')"
          echo "TZ=$TZ offset=$OFFSET"
          if [ "$OFFSET" = "+0000" ]; then
            echo "The timezone guard below is pointless on a UTC offset -- TZ did not take effect." >&2
            exit 1
          fi

      # Seeded from the test files that assert on utcnow / timezone.utc /
      # fromtimestamp / .timestamp(). Verified green under BOTH UTC and
      # America/Los_Angeles before being gated (678 passed), so this starts as a pure
      # regression guard rather than a backlog to work off.
      #
      # Five files are deliberately excluded because they fail identically under both
      # timezones, i.e. they are pre-existing and unrelated to this axis:
      #   tests/http_client/test_http_client_retry_after.py
      #   tests/http_client/test_http_client_stream_timeouts.py
      #   tests/Sharing/test_shared_workspace_clone_endpoints.py
      #   tests/Sharing/test_shared_workspace_recipient_endpoints.py
      #   tests/test_authnz_backends_improved.py
      # Grow this list as timestamp coverage grows; shrink the exclusions as those five
      # get fixed.
      - name: Timestamp-sensitive tests under a non-UTC timezone
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          TZ: America/Los_Angeles
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          # Plugins are named explicitly because setup-python-deps writes
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 into $GITHUB_ENV ("Enforce pytest plugin
          # isolation"), which applies to every later step in the job. Without this,
          # --timeout is an unrecognised argument and the step dies with exit 4 before
          # running a single test -- which is exactly how this guard first failed, and
          # would have failed the same way in its original ci.yml home had it ever been
          # allowed to run.
          python -m pytest -q \
            -p pytest_asyncio.plugin \
            -p pytest_timeout \
            --timeout=300 \
            tldw_Server_API/tests/AuthNZ_SQLite/test_admin_endpoints_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_api_keys_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_llm_provider_overrides_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_mfa_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_monitoring_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_org_provider_secrets_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_rate_limits_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_sessions_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_token_blacklist_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_usage_repo_rollups_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_usage_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_user_provider_secrets_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_endpoints_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_oauth_state_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_rotation_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_runtime_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_llm_budget_402_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_scheduler_auth_failure_monitor_sqlite.py \
            tldw_Server_API/tests/Discord/test_discord_oauth_lifecycle.py \
            tldw_Server_API/tests/Embeddings/test_request_signing_nonce_cleanup.py \
            tldw_Server_API/tests/Flashcards/test_flashcards_endpoint_integration.py \
            tldw_Server_API/tests/Flashcards/test_flashcards_timestamp_contract.py \
            tldw_Server_API/tests/Flashcards/test_review_response_timestamp_contract.py \
            tldw_Server_API/tests/Flashcards/test_source_review_plans_api.py \
            tldw_Server_API/tests/Flashcards/test_study_response_timestamp_contract.py \
            tldw_Server_API/tests/Media_DB/test_media_clone_snapshot_repository.py \
            tldw_Server_API/tests/Personalization/test_companion_derivations.py \
            tldw_Server_API/tests/Personalization/test_companion_proactive_policy.py \
            tldw_Server_API/tests/Personalization/test_companion_reflection_jobs.py \
            tldw_Server_API/tests/Personalization/test_personalization_endpoints.py \
            tldw_Server_API/tests/Research/test_research_broker.py \
            tldw_Server_API/tests/Research/test_research_discovery_legacy_execution_contract.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_chat_endpoint.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_clone_operations.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_recipient_security_matrix.py

      # Boots the app in a DEPLOYMENT-SHAPED (scrubbed) environment — no
      # TEST_MODE, no conftest env forcing — and probes /health. Catches the
      # "passes in CI with env vars, fails in a real deployment" class (#2590/
      # e88c96500f). The script manages its own minimal child env, so no test
      # env is set at the step level.
      - name: Minimal-env startup smoke
        if: needs.changes.outputs.backend_changed == 'true'
        run: |
          python Helper_Scripts/ci/minimal_env_smoke.py --timeout 150

      # OpenAPI contract drift gate (RF1 / #2590 class): recompute the schema
      # fingerprint and fail if it drifts from the checked-in snapshot. A
      # backend Pydantic model change that alters the API without updating the
      # snapshot (and regenerating the frontend types) fails here. Runs in the
      # backend workflow because it is guaranteed to run on drift-causing PRs
      # and has the server deps installed.
      - name: OpenAPI contract drift gate
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          PYTHONPATH: .
        run: |
          python Helper_Scripts/export_openapi_schema.py \
            --check apps/tldw-frontend/lib/api/openapi.fingerprint.json

  # Wakes the merge queue when the gate above fails (TASK-13462, section 4.6 of
  # Docs/superpowers/specs/2026-10-04-merge-queue-design.md). A red gate causes
  # none of the events merge-queue.yml listens for, so without this a failed
  # front PR would never be retried or removed from the line.
  #
  # Not required and in no job's `needs`, so it cannot turn the required check
  # red. Skipped on every run while the repository variable MERGE_QUEUE is unset
  # or off, and for fork PRs. It checks out dev, never the PR, so the queue
  # script that runs with these write permissions is dev's copy.
  queue-tick:
    name: Merge queue tick
    needs: [backend-required]
    if: >-
      always() && !cancelled() &&
      needs.backend-required.result == 'failure' &&
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write: rebase the front PR's branch, comment and disarm, dispatch/cancel/delete runs.
      contents: write
      pull-requests: write
      actions: write
      # read: the six required check runs and the license commit status on the front PR's head.
      checks: read
      statuses: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dev
          persist-credentials: false
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
        run: python3 -m Helper_Scripts.ci.merge_queue
