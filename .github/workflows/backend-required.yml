name: backend-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for change detection (manual diagnostic dispatches)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-required-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: [await_license]
    if: >-
      always() && !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.await_license.outputs.license_passed == 'true')
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required }}
      chacha_owner_scope_changed: ${{ steps.detect.outputs.chacha_owner_scope_changed }}
      rag_pipeline_changed: ${{ steps.detect.outputs.rag_pipeline_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        uses: ./.github/actions/detect-required-gate-changes
      # Every PR runs this job, backlog-only ones included, while backend-required's own
      # steps skip when no backend path changed; so the task id check lives here (TASK-13960).
      - name: Check backlog task ids are unique
        run: python3 Helper_Scripts/ci/check_backlog_task_ids.py .

  # The complete timezone axis has its own budget; backend-required still rejects
  # any missing or unsuccessful result before its other gates (TASK-13260.278.18.83.45).
  non-utc-tests:
    name: Backend timestamps (non-UTC)
    runs-on: ubuntu-latest
    needs: [changes, await_license]
    if: >-
      always() && !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.await_license.outputs.license_passed == 'true')
      ) &&
      (
        needs.changes.result == 'success' &&
        needs.changes.outputs.backend_changed == 'true'
      )
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: needs.changes.outputs.backend_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        if: needs.changes.outputs.backend_changed == 'true'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: "true"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      # Timezone axis. Every other job and step runs on UTC, where a naive-vs-aware
      # datetime bug has a delta of exactly zero and is therefore invisible. TASK-13299
      # shipped a 7-hour error in OpenAI-compatible `created` timestamps for precisely
      # that reason, on a product whose target deployment is a user's own machine.
      #
      # This lives in the required lane deliberately. It was first added as a standalone
      # job in ci.yml, whose result is not part of protected-branch enforcement, so a
      # timestamp regression could fail it without blocking the merge — the guard was
      # decorative. `backend-required` is enforced gate 1 of 6 per
      # Docs/Development/CI_REQUIRED_GATES.md.
      - name: Confirm the runner is not on UTC
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          TZ: America/Los_Angeles
        shell: bash
        run: |
          set -euo pipefail
          OFFSET="$(python -c 'import time; print(time.strftime("%z"))')"
          echo "TZ=$TZ offset=$OFFSET"
          if [ "$OFFSET" = "+0000" ]; then
            echo "The timezone guard below is pointless on a UTC offset -- TZ did not take effect." >&2
            exit 1
          fi

      # Seeded from the test files that assert on utcnow / timezone.utc /
      # fromtimestamp / .timestamp(). Verified green under BOTH UTC and
      # America/Los_Angeles before being gated (678 passed), so this starts as a pure
      # regression guard rather than a backlog to work off.
      #
      # Five files are deliberately excluded because they fail identically under both
      # timezones, i.e. they are pre-existing and unrelated to this axis:
      #   tests/http_client/test_http_client_retry_after.py
      #   tests/http_client/test_http_client_stream_timeouts.py
      #   tests/Sharing/test_shared_workspace_clone_endpoints.py
      #   tests/Sharing/test_shared_workspace_recipient_endpoints.py
      #   tests/test_authnz_backends_improved.py
      # Grow this list as timestamp coverage grows; shrink the exclusions as those five
      # get fixed.
      - name: Timestamp-sensitive tests under a non-UTC timezone
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          TZ: America/Los_Angeles
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          # Plugins are named explicitly because setup-python-deps writes
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 into $GITHUB_ENV ("Enforce pytest plugin
          # isolation"), which applies to every later step in the job. Without this,
          # --timeout is an unrecognised argument and the step dies with exit 4 before
          # running a single test -- which is exactly how this guard first failed, and
          # would have failed the same way in its original ci.yml home had it ever been
          # allowed to run.
          python -m pytest -q \
            -p pytest_asyncio.plugin \
            -p pytest_timeout \
            --timeout=300 \
            tldw_Server_API/tests/AuthNZ_SQLite/test_admin_endpoints_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_api_keys_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_llm_provider_overrides_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_mfa_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_monitoring_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_org_provider_secrets_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_rate_limits_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_sessions_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_token_blacklist_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_usage_repo_rollups_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_usage_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_authnz_user_provider_secrets_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_endpoints_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_oauth_state_repo_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_rotation_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_byok_runtime_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_llm_budget_402_sqlite.py \
            tldw_Server_API/tests/AuthNZ_SQLite/test_scheduler_auth_failure_monitor_sqlite.py \
            tldw_Server_API/tests/Discord/test_discord_oauth_lifecycle.py \
            tldw_Server_API/tests/Embeddings/test_request_signing_nonce_cleanup.py \
            tldw_Server_API/tests/Flashcards/test_flashcards_endpoint_integration.py \
            tldw_Server_API/tests/Flashcards/test_flashcards_timestamp_contract.py \
            tldw_Server_API/tests/Flashcards/test_review_response_timestamp_contract.py \
            tldw_Server_API/tests/Flashcards/test_source_review_plans_api.py \
            tldw_Server_API/tests/Flashcards/test_study_response_timestamp_contract.py \
            tldw_Server_API/tests/Media_DB/test_media_clone_snapshot_repository.py \
            tldw_Server_API/tests/Personalization/test_companion_derivations.py \
            tldw_Server_API/tests/Personalization/test_companion_proactive_policy.py \
            tldw_Server_API/tests/Personalization/test_companion_reflection_jobs.py \
            tldw_Server_API/tests/Personalization/test_personalization_endpoints.py \
            tldw_Server_API/tests/Research/test_research_broker.py \
            tldw_Server_API/tests/Research/test_research_discovery_legacy_execution_contract.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_chat_endpoint.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_clone_operations.py \
            tldw_Server_API/tests/Sharing/test_shared_workspace_recipient_security_matrix.py

  # The ChaCha owner-isolation files only mean something on PostgreSQL, where RLS and the
  # owner predicates are real, and they take 7 to 27 minutes. So they run in their own
  # job, only when a path that can change ChaCha owner scoping changed
  # (chacha_owner_scope_changed), and backend-required rejects any other outcome
  # (TASK-13950.23). Serial: -n 2 fails xdist collection on these files' parametrize ids.
  chacha-owner-isolation:
    name: ChaCha owner isolation (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [changes, await_license]
    if: >-
      always() && !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.await_license.outputs.license_passed == 'true')
      ) &&
      (
        needs.changes.result == 'success' &&
        needs.changes.outputs.backend_changed == 'true' &&
        needs.changes.outputs.chacha_owner_scope_changed == 'true'
      )
    timeout-minutes: 40
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && needs.changes.outputs.backend_changed == 'true' && needs.changes.outputs.chacha_owner_scope_changed == 'true' && 'mirror.gcr.io/library/postgres:18-bookworm' || '' }}
        env:
          POSTGRES_USER: tldw_user
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: tldw_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tldw_user -d tldw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: "true"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: ChaCha owner isolation on PostgreSQL
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          TEST_MODE: 'true'
          DISABLE_HEAVY_STARTUP: '1'
          MINIMAL_TEST_APP: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          TLDW_TEST_POSTGRES_REQUIRED: '1'
          TLDW_TEST_NO_DOCKER: '1'
          POSTGRES_TEST_HOST: 127.0.0.1
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_TEST_USER: tldw_user
          POSTGRES_TEST_PASSWORD: TestPassword123!
          POSTGRES_TEST_DB: tldw_test
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/owner-isolation.xml"
          pytest -q --disable-warnings -p pytest_asyncio.plugin -p pytest_timeout --timeout=180 \
            --durations=15 \
            --junitxml="$report" \
            tldw_Server_API/tests/ChaChaNotesDB/test_chacha_message_store.py \
            tldw_Server_API/tests/ChaChaNotesDB/test_web_clipper_postgres_tenancy.py \
            tldw_Server_API/tests/DB_Management/test_chacha_owner_scope_required.py \
            tldw_Server_API/tests/DB_Management/test_chacha_study_tables_rls.py \
            tldw_Server_API/tests/DB_Management/test_core_chat_owner_isolation.py \
            tldw_Server_API/tests/DB_Management/test_core_chat_rls_postgres.py \
            tldw_Server_API/tests/DB_Management/test_local_keyword_merge_survivor.py \
            tldw_Server_API/tests/DB_Management/test_note_shared_owner_contract.py \
            tldw_Server_API/tests/DB_Management/test_study_suggestion_owner_scope.py
          # The skip hook cannot see collection-time skips: fail unless every listed file
          # contributed a passing case and nothing at all was skipped.
          python - "$report" \
            tldw_Server_API/tests/ChaChaNotesDB/test_chacha_message_store.py \
            tldw_Server_API/tests/ChaChaNotesDB/test_web_clipper_postgres_tenancy.py \
            tldw_Server_API/tests/DB_Management/test_chacha_owner_scope_required.py \
            tldw_Server_API/tests/DB_Management/test_chacha_study_tables_rls.py \
            tldw_Server_API/tests/DB_Management/test_core_chat_owner_isolation.py \
            tldw_Server_API/tests/DB_Management/test_core_chat_rls_postgres.py \
            tldw_Server_API/tests/DB_Management/test_local_keyword_merge_survivor.py \
            tldw_Server_API/tests/DB_Management/test_note_shared_owner_contract.py \
            tldw_Server_API/tests/DB_Management/test_study_suggestion_owner_scope.py <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report, files = sys.argv[1], sys.argv[2:]
          passed = {f: 0 for f in files}
          skipped = []
          for case in ET.parse(report).getroot().iter("testcase"):
              classname = case.get("classname", "")
              bad = case.find("skipped") is not None
              if bad:
                  skipped.append(f"{classname}::{case.get('name')}")
              ok = not bad and case.find("failure") is None and case.find("error") is None
              for f in files:
                  module = f[: -len(".py")].replace("/", ".")
                  if ok and (classname == module or classname.startswith(module + ".")):
                      passed[f] += 1
          missing = [f for f, n in passed.items() if n == 0]
          if skipped or missing:
              print("::error::owner-isolation files with no passing case: " + ", ".join(missing))
              print("::error::skipped cases: " + ", ".join(skipped[:20]))
              sys.exit(1)
          PY

  # RAG pipeline (TASK-13950.24): the golden-output test and the pipeline tests, only when RAG paths change.
  # Serial, like chacha-owner-isolation; backend-required rejects any outcome but a pass when due.
  rag-pipeline:
    name: RAG pipeline (golden + pipeline tests)
    runs-on: ubuntu-latest
    needs: [changes, await_license]
    if: >-
      always() && !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.await_license.outputs.license_passed == 'true')
      ) &&
      (
        needs.changes.result == 'success' &&
        needs.changes.outputs.backend_changed == 'true' &&
        needs.changes.outputs.rag_pipeline_changed == 'true'
      )
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && needs.changes.outputs.backend_changed == 'true' && needs.changes.outputs.rag_pipeline_changed == 'true' && 'mirror.gcr.io/library/postgres:18-bookworm' || '' }}
        env:
          POSTGRES_USER: tldw_user
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: tldw_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tldw_user -d tldw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install FFmpeg and PortAudio (Linux)
        uses: ./.github/actions/setup-ffmpeg
        with:
          install-ffmpeg: 'false'
          install-portaudio: 'true'

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.12"
          use-uv: "true"
          enable-pip-cache: "true"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
          extras: dev

      - name: RAG pipeline golden and pipeline tests
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          TEST_MODE: 'true'
          DISABLE_HEAVY_STARTUP: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          TLDW_TEST_POSTGRES_REQUIRED: '1'
          TLDW_TEST_NO_DOCKER: '1'
          POSTGRES_TEST_HOST: 127.0.0.1
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_TEST_USER: tldw_user
          POSTGRES_TEST_PASSWORD: TestPassword123!
          POSTGRES_TEST_DB: tldw_test
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/rag-pipeline.xml"
          pytest -q --disable-warnings -p pytest_asyncio.plugin -p pytest_timeout --timeout=180 \
            --durations=15 \
            --junitxml="$report" \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_ablate_api.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_batch_checkpoint_api.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_batch_resume_api.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_convenience_endpoint_credentials.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_doc_researcher_api.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_integration.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_request_contract_parity.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_stream_parity.py \
            tldw_Server_API/tests/RAG_NEW/integration/test_rag_strict_extractive_nli_api.py \
            tldw_Server_API/tests/RAG_NEW/property/test_rag_properties.py \
            tldw_Server_API/tests/RAG_NEW/test_prf_and_spans.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_batch_round2_flags.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_evidence_chain_provider_isolation.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_generation_executor.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_hyde.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_knowledge_source_retrieval_coverage.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_learned_fusion_simple.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_pipeline_generation_controls.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_pipeline_post_verification_metadata.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_pipeline_two_tier_gate.py \
            tldw_Server_API/tests/RAG_NEW/unit/test_post_retrieval_coordinator.py \
