name: security-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for change detection (the merge queue passes dev's tip)
        required: false
        type: string

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-required-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: security-required.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed || steps.detect_admitted.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed || steps.detect_admitted.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed || steps.detect_admitted.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed || steps.detect_admitted.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required || steps.detect_admitted.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/detect-required-gate-changes
      - id: detect_admitted
        name: Classify admitted changed files
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES_PATH="${RUNNER_TEMP}/required-gate-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES_PATH"
          mapfile -t CHANGED_FILES < "$CHANGED_FILES_PATH"
          python -m Helper_Scripts.ci.emit_ci_gate_flags "${CHANGED_FILES[@]}"

  security-required:
    name: security-required
    runs-on: ubuntu-latest
    needs: [changes, admission, await_license]
    # This is the `changes` job's own condition and deliberately does not ask
    # for needs.changes.result == 'success': when change detection was admitted
    # and did not succeed, this job was skipped, and GitHub counts a skipped
    # required job as satisfied. It now runs and the first step fails it
    # (TASK-13462).
    # The last arm makes a license wait that was cancelled, failed or negative
    # reach the refusal step below and go red. Without it this job is skipped,
    # and GitHub counts a skipped required job as satisfied (TASK-13502).
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        ) ||
        (
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        )
      )
    timeout-minutes: 20
    steps:
      # Stays first: no later step uses a status function, so none runs once
      # this has failed.
      - name: Require the license audit to have passed
        if: >-
          github.event_name != 'workflow_run' &&
          needs.await_license.result != 'skipped' &&
          needs.await_license.outputs.license_passed != 'true'
        run: |
          echo "::error::License audit did not pass for this PR head, so the gates were not run. Fix the licence policy failure and re-run."
          exit 1

      - name: Require change detection to have succeeded
        if: needs.changes.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::Change detection (the 'changes' job) ended as '${CHANGES_RESULT}', not 'success', so this gate cannot tell what the head changed and ran nothing. Re-run the workflow."
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pyyaml

      - name: No-op pass (security irrelevant change set)
        if: needs.changes.outputs.security_relevant_changed != 'true'
        run: echo "No security-relevant paths changed; bandit scan skipped by policy."

      # The last arm is the merge queue's dispatch: without it a dispatched run
      # skipped this step and the gate passed without a dependency review. A
      # dispatch has no pull_request payload, so the action is given both refs:
      # inputs.base_sha (dev's tip) and github.sha (the dispatched branch's head).
      - name: Dependency review (high/critical)
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.base_sha != '')
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          base-ref: ${{ inputs.base_sha || needs.admission.outputs.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ needs.admission.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high

      - name: Run Bandit scan
        if: needs.changes.outputs.security_relevant_changed == 'true'
        run: |
          python -m bandit -r tldw_Server_API/app -f json -o /tmp/bandit_security_required.json --exit-zero

      - name: Enforce high/critical threshold with allowlist
        if: needs.changes.outputs.security_relevant_changed == 'true'
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          import yaml

          allowlist_path = Path(".github/security/ci-allowlist.yml")
          allowlist_doc = yaml.safe_load(allowlist_path.read_text(encoding="utf-8")) or {}
          allow_entries = allowlist_doc.get("allowlist", [])

          today = datetime.date.today()
          allowed_ids = set()
          for entry in allow_entries:
              vuln_id = (entry or {}).get("id")
              expires = (entry or {}).get("expires")
              if not vuln_id or not expires:
                  continue
              try:
                  expiry_date = datetime.date.fromisoformat(str(expires))
              except ValueError:
                  continue
              if expiry_date >= today:
                  allowed_ids.add(vuln_id)

          report = json.loads(Path("/tmp/bandit_security_required.json").read_text(encoding="utf-8"))
          violations = []
          for finding in report.get("results", []):
              severity = str(finding.get("issue_severity", "")).upper()
              test_id = finding.get("test_id")
              if severity in {"HIGH", "CRITICAL"} and test_id not in allowed_ids:
                  violations.append(
                      {
                          "test_id": test_id,
                          "severity": severity,
                          "filename": finding.get("filename"),
                          "line_number": finding.get("line_number"),
                          "issue_text": finding.get("issue_text"),
                      }
                  )

          if violations:
              print("Security threshold violations detected:")
              for violation in violations:
                  print(violation)
              raise SystemExit(1)

          print("No unallowlisted HIGH/CRITICAL findings detected.")
          PY

  # Wakes the merge queue when the gate above fails (TASK-13462, section 4.6 of
  # Docs/superpowers/specs/2026-10-04-merge-queue-design.md). A red gate causes
  # none of the events merge-queue.yml listens for, so without this a failed
  # front PR would never be retried or removed from the line.
  #
  # Not required and in no job's `needs`, so it cannot turn the required check
  # red. Skipped on every run while the repository variable MERGE_QUEUE is unset
  # or off, and for fork PRs. It checks out dev, never the PR, so the queue
  # script that runs with these write permissions is dev's copy.
  queue-tick:
    name: Merge queue tick
    needs: [security-required]
    if: >-
      always() && !cancelled() &&
      needs.security-required.result == 'failure' &&
      (vars.MERGE_QUEUE == 'dry' || vars.MERGE_QUEUE == 'on') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write: rebase the front PR's branch, comment and disarm, dispatch/cancel/delete runs.
      contents: write
      pull-requests: write
      actions: write
      # read: the six required check runs and the license commit status on the front PR's head.
      checks: read
      statuses: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dev
          persist-credentials: false
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
        run: python3 -m Helper_Scripts.ci.merge_queue
