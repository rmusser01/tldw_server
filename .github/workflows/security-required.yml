name: security-required

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-required-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: security-required.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  changes:
    name: Detect Gate Changes
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed || steps.detect_admitted.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed || steps.detect_admitted.outputs.frontend_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed || steps.detect_admitted.outputs.e2e_changed }}
      security_relevant_changed: ${{ steps.detect.outputs.security_relevant_changed || steps.detect_admitted.outputs.security_relevant_changed }}
      coverage_required: ${{ steps.detect.outputs.coverage_required || steps.detect_admitted.outputs.coverage_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.sha }}
          persist-credentials: false
      - id: detect
        name: Classify changed files
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/detect-required-gate-changes
      - id: detect_admitted
        name: Classify admitted changed files
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES_PATH="${RUNNER_TEMP}/required-gate-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES_PATH"
          mapfile -t CHANGED_FILES < "$CHANGED_FILES_PATH"
          python -m Helper_Scripts.ci.emit_ci_gate_flags "${CHANGED_FILES[@]}"

  security-required:
    name: security-required
    runs-on: ubuntu-latest
    needs: [changes, admission]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      ) &&
      (
        needs.changes.result == 'success'
      )
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pyyaml

      - name: No-op pass (security irrelevant change set)
        if: needs.changes.outputs.security_relevant_changed != 'true'
        run: echo "No security-relevant paths changed; bandit scan skipped by policy."

      - name: Fetch complete dependency comparison
        id: dependency_review_compare
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_run'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          BASE_SHA: ${{ needs.admission.outputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.admission.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const base = process.env.BASE_SHA;
            const head = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(base) || !/^[0-9a-f]{40}$/.test(head)) {
              throw new Error('Dependency comparison requires exact base and head SHAs');
            }
            const evidence = path.join(process.env.RUNNER_TEMP, 'dependency-review');
            fs.mkdirSync(evidence, {recursive: true});
            const pages = [];
            for await (const response of github.paginate.iterator(
              'GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}',
              {...context.repo, basehead: `${base}...${head}`, per_page: 100}
            )) {
              pages.push(response.data);
            }
            fs.writeFileSync(path.join(evidence, 'compare-pages.json'), JSON.stringify(pages));
            if (!pages.length || pages.some(page => !Array.isArray(page))) {
              throw new Error('Dependency comparison returned missing or malformed pages');
            }

      - name: Derive scoped dependency review allowances
        id: dependency_review_prepare
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          python -m Helper_Scripts.Supply_Chain.dependency_review \
            --policy .github/supply-chain/vulnerability-exceptions.json \
            --changes "$RUNNER_TEMP/dependency-review/compare-pages.json" \
            --paginated --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/dependency-review/prepared-allowances.json"

      - name: Dependency review (high/critical)
        id: dependency_review
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_run'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          base-ref: ${{ needs.admission.outputs.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ needs.admission.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high
          allow-ghsas: ${{ steps.dependency_review_prepare.outputs.allow-ghsas }}

      - name: Validate dependency review allowance scope
        id: dependency_review_validate
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_run')
        shell: bash
        env:
          ALLOW_GHSAS: ${{ steps.dependency_review_prepare.outputs.allow-ghsas }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-review"
          # Encode the output as one JSON string: no shell expansion or environment-size limit.
          cat > "$RUNNER_TEMP/dependency-review/action-output-string.json" <<'DEPENDENCY_REVIEW_OUTPUT_JSON'
          ${{ toJSON(steps.dependency_review.outputs.dependency-changes) }}
          DEPENDENCY_REVIEW_OUTPUT_JSON
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "dependency-review"
          raw = json.loads((evidence / "action-output-string.json").read_text(encoding="utf-8"))
          if not isinstance(raw, str):
              raise SystemExit("Dependency review action output must be a JSON string")
          (evidence / "dependency-changes.json").write_text(raw, encoding="utf-8")
          PY
          python -m Helper_Scripts.Supply_Chain.dependency_review \
            --policy .github/supply-chain/vulnerability-exceptions.json \
            --changes "$RUNNER_TEMP/dependency-review/dependency-changes.json" \
            --allow-ghsas "$ALLOW_GHSAS" \
            > "$RUNNER_TEMP/dependency-review/validated-allowances.json"

      - name: Upload dependency review evidence
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_run')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-review/
          if-no-files-found: error

      - name: Run Bandit scan
        if: needs.changes.outputs.security_relevant_changed == 'true'
        run: |
          python -m bandit -r tldw_Server_API/app -f json -o /tmp/bandit_security_required.json --exit-zero

      - name: Enforce high/critical threshold with allowlist
        if: needs.changes.outputs.security_relevant_changed == 'true'
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          import yaml

          allowlist_path = Path(".github/security/ci-allowlist.yml")
          allowlist_doc = yaml.safe_load(allowlist_path.read_text(encoding="utf-8")) or {}
          allow_entries = allowlist_doc.get("allowlist", [])

          today = datetime.date.today()
          allowed_ids = set()
          for entry in allow_entries:
              vuln_id = (entry or {}).get("id")
              expires = (entry or {}).get("expires")
              if not vuln_id or not expires:
                  continue
              try:
                  expiry_date = datetime.date.fromisoformat(str(expires))
              except ValueError:
                  continue
              if expiry_date >= today:
                  allowed_ids.add(vuln_id)

          report = json.loads(Path("/tmp/bandit_security_required.json").read_text(encoding="utf-8"))
          violations = []
          for finding in report.get("results", []):
              severity = str(finding.get("issue_severity", "")).upper()
              test_id = finding.get("test_id")
              if severity in {"HIGH", "CRITICAL"} and test_id not in allowed_ids:
                  violations.append(
                      {
                          "test_id": test_id,
                          "severity": severity,
                          "filename": finding.get("filename"),
                          "line_number": finding.get("line_number"),
                          "issue_text": finding.get("issue_text"),
                      }
                  )

          if violations:
              print("Security threshold violations detected:")
              for violation in violations:
                  print(violation)
              raise SystemExit(1)

          print("No unallowlisted HIGH/CRITICAL findings detected.")
          PY
