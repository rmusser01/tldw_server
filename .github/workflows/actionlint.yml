name: Lint Workflows (actionlint)

on:
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main, master ]
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install actionlint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "${asset}" \
            --output /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint ./actionlint
          ./actionlint -version

      - name: Run actionlint on targeted workflows
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color -config-file .github/actionlint.yaml \
            .github/workflows/actionlint.yml \
            .github/workflows/codeql.yml \
            .github/workflows/container-build-check.yml \
            .github/workflows/frontend-license-gate.yml \
            .github/workflows/frontend-ux-gates.yml \
            .github/workflows/publish-ghcr-main.yml \
            .github/workflows/publish-docker.yml \
            .github/workflows/sbom.yml \
            .github/workflows/vz-linux-host-gated.yml
