name: Lint Workflows (actionlint)

on:
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches: [ main, master ]
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: actionlint.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  actionlint:
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}" \
            --output /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint ./actionlint
          ./actionlint -version

      - name: Run actionlint on targeted workflows
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color -config-file .github/actionlint.yaml \
            .github/workflows/actionlint.yml \
            .github/workflows/codeql.yml \
            .github/workflows/container-build-check.yml \
            .github/workflows/frontend-license-gate.yml \
            .github/workflows/frontend-ux-gates.yml \
            .github/workflows/publish-ghcr-main.yml \
            .github/workflows/publish-docker.yml \
            .github/workflows/sbom.yml \
            .github/workflows/vz-linux-host-gated.yml
