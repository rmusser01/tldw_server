name: CodeQL

on:
  # Run on direct pushes to protected/default branches only
  push:
    branches: [ main, master ]
  # Run on PRs targeting main/master/dev, not every branch
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual runs
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: codeql.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  # The pull_request path reports to the PR, so it is the one branch protection
  # sees -- but it used to start every gate immediately, in parallel with the
  # license audit it is supposed to follow. This makes it wait for the verdict.
  await_license:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/license-first-await.yml
    permissions:
      contents: read
      statuses: read

  analyze:
    name: Analyze (CodeQL)
    needs: [admission, await_license]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        (
          github.event_name != 'workflow_run' &&
          (
            needs.await_license.result == 'skipped' ||
            needs.await_license.outputs.license_passed == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Repository-level default CodeQL setup currently handles SARIF ingestion.
          # Keep this advanced workflow as an analysis gate without uploading SARIF.
          upload: false
          category: '/language:${{matrix.language}}'
