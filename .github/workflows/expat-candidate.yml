name: Expat Native System Candidate Qualification

on:
  push:
    branches: [codex/task-13013-7-supply-chain-design]
    paths:
      - '.github/workflows/expat-candidate.yml'
      - 'Dockerfiles/candidates/expat/**'
      - 'Dockerfiles/candidates/ffmpeg/debian.sources'
      - 'Helper_Scripts/Supply_Chain/expat_candidate.py'
      - 'tldw_Server_API/tests/Supply_Chain/test_expat*native*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expat-system-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system:
    name: Native system parser qualification (not dual-copy admission)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Qualify system candidate
        shell: bash
        run: bash Dockerfiles/candidates/expat/qualify.sh controller "${RUNNER_TEMP}/expat-system-evidence"
      - name: Upload evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expat-system-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/expat-system-evidence/**
          if-no-files-found: error
          retention-days: 14
