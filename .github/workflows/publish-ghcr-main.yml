name: Publish verified GHCR main image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-ghcr-main-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  source-admission:
    name: Admit exact source dependencies
    uses: ./.github/workflows/sbom.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  build-scan-promote:
    name: Build, scan, and promote main
    needs:
      - source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfiles/Dockerfile.prod
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=main-app
          cache-to: type=gha,mode=max,scope=main-app

      - name: Inspect exact candidate subject
        id: identity
        shell: bash
        env:
          SUBJECT_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p evidence scanner
          candidate_ref="$CANDIDATE_TAG@$SUBJECT_DIGEST"
          docker buildx imagetools inspect "$candidate_ref" --raw \
            > evidence/subject-app.json
          SUBJECT_DIGEST="$SUBJECT_DIGEST" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          raw = Path("evidence/subject-app.json").read_bytes()
          actual = "sha256:" + hashlib.sha256(raw).hexdigest()
          if actual != os.environ["SUBJECT_DIGEST"]:
              raise SystemExit("candidate subject digest mismatch")
          payload = json.loads(raw)
          media_type = payload["mediaType"]
          if media_type in {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }:
              matches = [
                  item
                  for item in payload["manifests"]
                  if item.get("platform", {}).get("os") == "linux"
                  and item.get("platform", {}).get("architecture") == "amd64"
                  and item.get("annotations", {}).get(
                      "vnd.docker.reference.type"
                  ) != "attestation-manifest"
              ]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one linux/amd64 candidate manifest")
              child = matches[0]["digest"]
          elif media_type in {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }:
              child = os.environ["SUBJECT_DIGEST"]
          else:
              raise SystemExit("unsupported candidate subject media type")
          if not isinstance(child, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", child):
              raise SystemExit("invalid candidate platform digest")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"platform_digest={child}", file=output)
          PY
          printf 'candidate_ref=%s\n' "$candidate_ref" >> "$GITHUB_OUTPUT"

      - name: Verify embedded backend runtime
        id: runtime
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          SUBJECT_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.identity.outputs.platform_digest }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          export PLATFORM_REF="$IMAGE_REPOSITORY@$PLATFORM_DIGEST"
          docker buildx imagetools inspect "$PLATFORM_REF" --raw \
            > evidence/platform-manifest-app.json
          docker pull --platform linux/amd64 "$PLATFORM_REF"
          docker image inspect "$PLATFORM_REF" > "$RUNNER_TEMP/runtime-image-inspect.json"
          CONFIG_DIGEST="$(python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          raw = Path("evidence/platform-manifest-app.json").read_bytes()
          if "sha256:" + hashlib.sha256(raw).hexdigest() != os.environ["PLATFORM_DIGEST"]:
              raise SystemExit("runtime platform manifest digest mismatch")
          config = json.loads(raw)["config"]["digest"]
          if not isinstance(config, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", config):
              raise SystemExit("invalid runtime config digest")
          images = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runtime-image-inspect.json").read_text())
          if len(images) != 1:
              raise SystemExit("expected exactly one pulled runtime image")
          image = images[0]
          if (image["Os"], image["Architecture"]) != ("linux", "amd64"):
              raise SystemExit("runtime image platform mismatch")
          if os.environ["PLATFORM_REF"] not in image["RepoDigests"]:
              raise SystemExit("runtime image repository digest mismatch")
          print(config)
          PY
          )"
          export CONFIG_DIGEST
          docker run --rm --pull never --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --workdir /tmp --env PYTHONDONTWRITEBYTECODE=1 \
            --env USER_DB_BASE_DIR=/tmp/user_databases \
            --env DATABASE_URL=sqlite:////tmp/users.db --env HF_HOME=/tmp/huggingface \
            --volume "$PWD/Helper_Scripts/Supply_Chain/runtime_probe.py:/probe/runtime_probe.py:ro" \
            --volume "$PWD/uv.lock:/probe/uv.lock:ro" \
            --entrypoint python "$PLATFORM_REF" \
            /probe/runtime_probe.py probe --lock /probe/uv.lock \
            > "$RUNNER_TEMP/runtime-probe.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runtime-probe.json").read_text())
          result.update({
              "subject_digest": os.environ["SUBJECT_DIGEST"],
              "platform_manifest_digest": os.environ["PLATFORM_DIGEST"],
              "config_digest": os.environ["CONFIG_DIGEST"],
          })
          Path("evidence/runtime-image-app.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Prepare fresh pinned Trivy database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --volume "$PWD/scanner:/trivy-cache:rw" \
            "$TRIVY_IMAGE" image --download-db-only --cache-dir /trivy-cache
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          payload = json.loads(Path("scanner/db/metadata.json").read_text())
          updated = datetime.fromisoformat(payload["UpdatedAt"].replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - updated
          assert timedelta(minutes=-5) <= age <= timedelta(hours=24), age
          PY

      - name: Scan exact candidate subject
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.identity.outputs.candidate_ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm --platform linux/amd64 \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=512m \
              --env TRIVY_USERNAME \
              --env TRIVY_PASSWORD \
              --volume "$PWD/evidence:/work:rw" \
              --volume "$PWD/scanner:/trivy-cache:rw" \
              --workdir /work \
              "$TRIVY_IMAGE" "$@"
          }
          trivy image --platform linux/amd64 \
            --cache-dir /trivy-cache --skip-db-update \
            --scanners vuln --ignore-unfixed=false --format json \
            --output trivy-image-app.json "$CANDIDATE_REF"
          trivy image --platform linux/amd64 \
            --cache-dir /trivy-cache --skip-db-update \
            --scanners vuln --ignore-unfixed=false --format cyclonedx \
            --output sbom-image-app.cdx.json "$CANDIDATE_REF"

      - name: Evaluate candidate vulnerability policy
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from dataclasses import asdict
          from datetime import date
          from pathlib import Path

          from Helper_Scripts.Supply_Chain.exception_policy import (
              evaluate_trivy_report,
              load_policy,
          )

          root = Path("evidence")
          report = json.loads((root / "trivy-image-app.json").read_text())
          policy = load_policy(
              Path(".github/supply-chain/vulnerability-exceptions.json"),
              today=date.today(),
          )
          decision = evaluate_trivy_report(
              report,
              component="image-app",
              policy=policy,
              today=date.today(),
          )
          payload = {
              "component": decision.component,
              "blocking": [asdict(item) for item in decision.blocking],
              "excepted": [asdict(item) for item in decision.excepted],
              "unmatched_exception_ids": list(decision.unmatched_exception_ids),
          }
          (root / "scan-decision-image-app.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          if decision.blocking or decision.unmatched_exception_ids:
              raise SystemExit("main candidate rejected by vulnerability policy")
          PY

      - name: Attest exact candidate subject
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Hash candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
            evidence/provenance-image-app.jsonl
          (
            cd evidence
            sha256sum \
              subject-app.json \
              platform-manifest-app.json \
              runtime-image-app.json \
              trivy-image-app.json \
              sbom-image-app.cdx.json \
              scan-decision-image-app.json \
              provenance-image-app.jsonl \
              > SHA256SUMS-image-app
            sha256sum -c SHA256SUMS-image-app
          )

      - name: Upload candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-image-admission-evidence
          path: evidence/
          if-no-files-found: error

      - name: Require candidate admission
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.policy.outcome }}" = "success"
          test "${{ steps.runtime.outcome }}" = "success"

      - name: Promote verified main aliases
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_REF: ${{ steps.identity.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          expected_digest="$EXPECTED_DIGEST"
          short_sha="${GITHUB_SHA:0:12}"
          for tag in main "sha-$short_sha"; do
            target="$REGISTRY/$IMAGE_NAME:$tag"
            docker buildx imagetools create --tag "$target" "$CANDIDATE_REF"
            actual_digest="$(docker buildx imagetools inspect "$target" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$actual_digest" = "$expected_digest"
          done
