name: UI Watchlists Help Tests

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "apps/packages/ui/src/components/Option/Watchlists/WatchlistsPlaygroundPage.tsx"
      - "apps/packages/ui/src/components/Option/Watchlists/__tests__/WatchlistsPlaygroundPage.help-links.test.tsx"
      - "apps/packages/ui/src/components/Option/Watchlists/shared/help-docs.ts"
      - "apps/packages/ui/src/components/Option/Watchlists/shared/__tests__/help-docs.test.ts"
      - "apps/packages/ui/src/assets/locale/en/watchlists.json"
      - "apps/packages/ui/src/public/_locales/en/watchlists.json"
      - "apps/packages/ui/package.json"
      - "apps/packages/ui/vitest.config.ts"
      - "apps/bun.lock"
      - ".github/workflows/ui-watchlists-help-tests.yml"
  workflow_run:
    workflows: [Frontend License Gate Audit]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "apps/packages/ui/src/components/Option/Watchlists/WatchlistsPlaygroundPage.tsx"
      - "apps/packages/ui/src/components/Option/Watchlists/__tests__/WatchlistsPlaygroundPage.help-links.test.tsx"
      - "apps/packages/ui/src/components/Option/Watchlists/shared/help-docs.ts"
      - "apps/packages/ui/src/components/Option/Watchlists/shared/__tests__/help-docs.test.ts"
      - "apps/packages/ui/src/assets/locale/en/watchlists.json"
      - "apps/packages/ui/src/public/_locales/en/watchlists.json"
      - "apps/packages/ui/package.json"
      - "apps/packages/ui/vitest.config.ts"
      - "apps/bun.lock"
      - ".github/workflows/ui-watchlists-help-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-watchlists-help-tests-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    if: >-
      vars.LICENSE_FIRST_CI_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/license-first-admission.yml
    with:
      workflow_file: ui-watchlists-help-tests.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read

  watchlists-help-vitest:
    name: Watchlists Help Vitest (Serial)
    needs: admission
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.admission.result == 'success' &&
          needs.admission.outputs.should_run == 'true'
        ) ||
        github.event_name != 'workflow_run'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.admission.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install workspace dependencies
        working-directory: apps
        run: bun install --frozen-lockfile

      - name: Run Watchlists help documentation tests
        working-directory: apps/packages/ui
        env:
          CI: "true"
        run: bun run test:watchlists:help
