[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-unified"
version = "0.1.0"
description = "Standalone MCP Unified runtime and gateway package boundary."
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = [
  "pydantic>=2.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
core = [
  "pydantic>=2.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]
fastapi = [
  "fastapi>=0.136.3",
  "starlette>=1.0.1",
]
sqlite = [
  "SQLAlchemy>=2.0.29",
]
federation = [
  "pydantic>=2.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
]
gateway = [
  "pydantic>=2.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0.0",
  "fastapi>=0.136.3",
  "starlette>=1.0.1",
  "SQLAlchemy>=2.0.29",
  "uvicorn[standard]>=0.23.0",
]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "bandit>=1.7.0",
]

[project.scripts]
mcp-unified-gateway = "mcp_unified.gateway.cli:main"

[tool.setuptools]
include-package-data = false
packages = [
  "mcp_unified",
  "mcp_unified.federation",
  "mcp_unified.gateway",
  "mcp_unified.interfaces",
  "mcp_unified.profiles",
  "mcp_unified.storage",
]

[tool.setuptools.package-dir]
mcp_unified = "."
"mcp_unified.federation" = "federation"
"mcp_unified.gateway" = "gateway"
"mcp_unified.interfaces" = "interfaces"
"mcp_unified.profiles" = "profiles"
"mcp_unified.storage" = "storage"
