name: tldw-production-monitoring

# Standalone monitoring companion for docker-compose.production.yml.
# Start the production stack first so the external tldw-production_edge
# network and the app service alias exist.

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set an exact Prometheus image}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../Docs/Operations/monitoring/prometheus_alerts_tldw.yml:/etc/prometheus/alerts/tldw_alerts.yml:ro
      - ../../Docs/Operations/monitoring/alerts:/etc/prometheus/alerts/extra:ro
      - ${TLDW_METRICS_API_KEY_FILE:?Set a mode-0600 API-key file whose principal has system.logs}:/run/secrets/tldw_metrics_api_key:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - alertmanager
    networks:
      - edge
      - monitoring

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?Set an exact Alertmanager image}
    volumes:
      - ${ALERTMANAGER_CONFIG:-../../Docs/Operations/monitoring/alertmanager_webhook_only.yml}:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring

  grafana:
    image: ${GRAFANA_IMAGE:?Set an exact Grafana image}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER before starting Grafana}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting Grafana}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../Docs/Monitoring/Grafana_Dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - monitoring

networks:
  edge:
    external: true
    name: tldw-production_edge
  monitoring: {}

volumes:
  grafana_data:
