# ACP Agent Registry
# Defines available agents for the Agent Client Protocol.
# Each entry describes how to launch and configure an agent.
#
# Fields:
#   type: Unique identifier (used in API requests)
#   name: Human-readable display name
#   description: Short description of the agent's capabilities
#   command: Binary or command to execute
#   args: Command-line arguments (list)
#   env: Environment variables to pass (dict)
#   requires_api_key: Env var that must be set (null if none required)
#   default: Whether this is the default agent (only one should be true)
#   install_instructions: Steps to install the agent (list of strings)
#   docs_url: Link to agent documentation
#   support_state: ACP compatibility state; one of supported,
#     supported_with_caveats, experimental, documented_unverified, unsupported
#   verification_level: Evidence level; one of documented_only,
#     stub_smoke_tested, live_e2e_tested, sandbox_tested, production_supported
#   compatibility_notes: Release-facing compatibility caveat
#   compatibility_docs_url: Compatibility matrix or evidence document
#   entrypoint_strategy: ACP entrypoint strategy; one of native_acp,
#     external_acp_adapter, documented_candidate, custom_template
#   acp_command: ACP stdio command to probe; not inferred from command
#   acp_args: ACP stdio command arguments
#   adapter_source: Upstream adapter source when entrypoint_strategy is external_acp_adapter
#   credential_policy: How readiness checks account for credentials

agents:
  - type: claude_code
    name: Claude Code
    description: "Anthropic's Claude Code agent"
    command: claude
    args: []
    env: {}
    requires_api_key: ANTHROPIC_API_KEY
    default: true
    install_instructions:
      - "npm install -g @anthropic-ai/claude-code"
    docs_url: "https://docs.anthropic.com/en/docs/claude-code"
    support_state: documented_unverified
    verification_level: documented_only
    compatibility_notes: "Configured-agent setup is documented, but live Claude Code ACP compatibility remains blocked until credentials and an ACP-compatible stdio command are verified."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: documented_candidate
    acp_command: ""
    acp_args: []
    certification_blocker: adapter_required

  - type: codex
    name: OpenAI Codex CLI
    description: "OpenAI's coding agent via the Codex ACP adapter"
    command: codex
    args: []
    env: {}
    requires_api_key: null
    install_instructions:
      - "Install OpenAI Codex CLI using the current OpenAI instructions."
      - "Install zed-industries/codex-acp 0.15.0 from the GitHub release artifact and ensure codex-acp is on PATH."
    docs_url: "https://github.com/openai/codex"
    support_state: experimental
    verification_level: documented_only
    compatibility_notes: "Codex can be reached through zed-industries/codex-acp, but this tldw profile remains experimental until live ACP certification passes."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: external_acp_adapter
    acp_command: codex-acp
    acp_args: []
    adapter_source: zed-industries/codex-acp
    adapter_docs_url: "https://github.com/zed-industries/codex-acp"
    adapter_package: "@zed-industries/codex-acp"
    adapter_version: "0.15.0"
    adapter_version_policy: exact_pin_required
    adapter_install_source: github_release_preferred
    credential_policy: delegated_to_adapter
    runtime_backend: acp_downstream
    certification_blocker: live_certification_required

  - type: aider
    name: Aider
    description: "AI pair programming in your terminal"
    command: aider
    requires_api_key: null
    install_instructions:
      - "pip install aider-chat"
    docs_url: "https://aider.chat"
    support_state: documented_unverified
    verification_level: documented_only
    compatibility_notes: "Aider v0.86.2 was installed and configured May 23, 2026 on branch codex/acp-opencode-aider-llamacpp-certification commit 53c018269 to use a local llama.cpp OpenAI-compatible server at 127.0.0.1:9099; direct Aider prompting succeeded. ACP certification remains blocked because the installed Aider CLI exposes no ACP-compatible stdio server entrypoint."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: documented_candidate
    acp_command: ""
    acp_args: []
    certification_blocker: entrypoint_strategy_missing

  - type: goose
    name: Goose
    description: "Block's autonomous coding agent"
    command: goose
    requires_api_key: null
    install_instructions:
      - "brew install block/goose/goose"
      - "# or: cargo install goose-cli"
    docs_url: "https://github.com/block/goose"
    support_state: supported_with_caveats
    verification_level: live_e2e_tested
    compatibility_notes: "Goose native ACP completed May 23, 2026 backend live E2E through the macOS host runner on branch codex/acp-goose-backend-live-e2e commit f9ff03f88 with tldw-agent runner 0.1.0: health/setup-guide, session-new, prompt, redacted support views, diagnostics endpoint, cancel, and close passed. Sandbox, non-empty MCP injection, artifact-producing workflows, and reviewer-loop behavior remain unverified."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: native_acp
    acp_command: goose
    acp_args:
      - acp

  - type: hermes
    name: Hermes
    description: "Nous Research Hermes agent"
    command: hermes
    args: []
    env: {}
    requires_api_key: null
    install_instructions:
      - "Install Hermes Agent from https://github.com/NousResearch/hermes-agent"
    docs_url: "https://github.com/NousResearch/hermes-agent"
    default: false
    support_state: supported_with_caveats
    verification_level: live_e2e_tested
    compatibility_notes: "Hermes native ACP completed May 23, 2026 backend live E2E through the macOS host runner on branch codex/acp-hermes-live-e2e-certification commit 5e6672f8f with tldw-agent runner 0.1.0: health/setup-guide, session-new, prompt, redacted support views, diagnostics endpoint, cancel, and close passed. Sandbox, non-empty MCP injection, artifact-producing workflows, and reviewer-loop behavior remain unverified."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: native_acp
    acp_command: hermes
    acp_args:
      - acp
      - --accept-hooks

  - type: continue_dev
    name: Continue
    description: "Open-source AI code assistant"
    command: continue
    requires_api_key: null
    install_instructions:
      - "npm install -g @continuedev/cli"
    docs_url: "https://continue.dev"
    default: false
    support_state: documented_unverified
    verification_level: documented_only
    compatibility_notes: "Configured-agent setup is documented, but live Continue ACP compatibility remains blocked until an ACP-compatible Continue command is installed and verified."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: documented_candidate
    acp_command: ""
    acp_args: []
    certification_blocker: entrypoint_strategy_missing

  - type: opencode
    name: OpenCode
    description: "Terminal-based AI coding assistant"
    command: opencode
    args: []
    env: {}
    requires_api_key: null
    install_instructions:
      - "go install github.com/sst/opencode@latest"
    docs_url: "https://github.com/sst/opencode"
    default: false
    support_state: supported_with_caveats
    verification_level: live_e2e_tested
    compatibility_notes: "OpenCode v1.15.7 native ACP completed May 23, 2026 backend live E2E through the macOS host runner on branch codex/acp-opencode-aider-llamacpp-certification commit 53c018269 with tldw-agent runner 0.1.0 using a local llama.cpp OpenAI-compatible server at 127.0.0.1:9099: health/setup-guide, session-new, prompt, redacted support views, diagnostics endpoint, cancel, and close passed. Sandbox, non-empty MCP injection, artifact-producing workflows, and reviewer-loop behavior remain unverified."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: native_acp
    acp_command: opencode
    acp_args:
      - acp

  - type: custom
    name: Custom Agent
    description: "Configure a custom agent with your own settings"
    command: ""
    args: []
    env: {}
    requires_api_key: null
    default: false
    support_state: documented_unverified
    verification_level: documented_only
    compatibility_notes: "Custom ACP profiles require a named command, workspace policy, and certification evidence before release claims."
    compatibility_docs_url: "/docs-static/Development/ACP_Compatibility_Matrix.md"
    entrypoint_strategy: custom_template
    acp_command: ""
    acp_args: []
