# Resource Governor Policies (stub)
#
# This file defines example policies for development and local testing.
# In production, prefer RG_POLICY_STORE=db with policies managed via AuthNZ.

schema_version: 1

# Policy templates (anchors) for quick customization.
templates:
  core: &core_policy
    requests: { rpm: 600, burst: 2.0 }
    scopes: [user, api_key, ip]
    fail_mode: fallback_memory
  mcp_base: &mcp_base
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, client, api_key]
    fail_mode: fallback_memory  # acceptable local over-admission during outages

policies:
  # Core defaults for endpoints without explicit module-level policies.
  core.default: *core_policy

  # Safety net for every /api/ route no path or tag maps (see ADR-056).
  default: *core_policy

  # Cheap health/readiness probes should not spend the same bucket as
  # interactive app routes. The WebUI polls these while users work.
  health.default:
    requests: { rpm: 6000, burst: 1.0 }
    scopes: [ip]
    fail_mode: fallback_memory

  # Chat API: per-user and per-conversation controls
  chat.default:
    requests: { rpm: 300, burst: 2.0 }
    tokens:   { per_min: 1000000, burst: 1.5 }
    # Include api_key so ingress enforcement works before auth deps resolve user_id.
    scopes: [user, api_key, conversation]
    fail_mode: fail_closed

  # MCP ingestion/read paths
  mcp.ingestion:
    <<: *mcp_base

  mcp.default:
    <<: *mcp_base

  mcp.read:
    <<: *mcp_base
    requests: { rpm: 600, burst: 2.0 }  # Higher limit for read ops

  mcp.search:
    <<: *mcp_base
    requests: { rpm: 600, burst: 2.0 }

  mcp.rag_generation:
    requests: { rpm: 30, burst: 1.0 }
    scopes: [user, api_key]
    fail_mode: fallback_memory

  # AuthNZ guardrails (login, reset-password, etc.)
  # Applied by RG ingress via /api/v1/auth* route_map entries.
  authnz.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [entity]

  # AuthNZ sensitive endpoint policies (endpoint-level + ingress mapping).
  # forgot_password / resend_verification / magic_link.request keep a
  # server-wide bucket: they send email, so per-entity scoping alone would
  # not stop a spray across many addresses (see spec §3).
  authnz.forgot_password:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [global, entity]

  authnz.reset_password:
    # Equivalent to ~20 attempts/5 minutes with burst allowance.
    requests: { rpm: 4, burst: 5.0 }
    scopes: [entity]

  authnz.resend_verification:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [global, entity]

  authnz.magic_link.request:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [global, entity]

  authnz.magic_link.email:
    # Approximate 3 requests per 10 minutes per normalized email identity.
    requests: { rpm: 0.3, burst: 10.0 }
    scopes: [entity]

  authnz.mfa.verify:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [entity]

  authnz.mfa.login:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [entity]

  # Embeddings service (OpenAI-compatible)
  embeddings.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key]

  # Embeddings server (worker / internal service)
  embeddings_server.default:
    requests: { rpm: 120, burst: 2.0 }
    scopes: [service]
    fail_mode: fallback_memory

  # Audio: request-rate safety net only.
  audio.default:
    # Allow reasonable request rate so informational GETs (status/limits)
    # are not denied by middleware. Per-user audio minutes and queued-job
    # concurrency are UserProfiles limits.* values (spec 2).
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key, ip]
    fail_mode: fail_closed

  # Character Chat / Characters module (legacy per-user limiter compat)
  character_chat.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key]

  # Evaluations module
  evals.default:
    # Ingress middleware enforces `requests` for `/api/v1/evaluations/*`.
    # The Evaluations module reserves `evaluations` (+ optional `tokens`) for
    # per-minute rates; per-user daily caps are UserProfiles `limits.*` keys
    # (spec 2).
    requests: { rpm: 120, burst: 2.0 }
    tokens: { per_min: 1000000, burst: 1.0 }
    scopes: [user, api_key]

  # Evaluations tier policies (used by the evaluations module)
  evals.free:
    evaluations: { per_min: 10, burst: 1.5 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.basic:
    evaluations: { per_min: 30, burst: 1.33 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.premium:
    evaluations: { per_min: 100, burst: 1.25 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.enterprise:
    evaluations: { per_min: 500, burst: 1.2 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]

  evals.free.batch:
    evaluations: { per_min: 2, burst: 3.5 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.basic.batch:
    evaluations: { per_min: 5, burst: 3.0 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.premium.batch:
    evaluations: { per_min: 20, burst: 2.25 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]
  evals.enterprise.batch:
    evaluations: { per_min: 100, burst: 2.0 }
    tokens: { per_min: 0, burst: 1.0 }
    scopes: [user, api_key]

  # Web scraping service (internal service scope).
  # Used by the research/websearch module to fetch external pages.
  # Limits are moderate (60 rpm) to avoid hammering upstream sites while
  # keeping local scrapers responsive. `fail_mode=fallback_memory` keeps
  # scraping available during RG store outages by falling back to in-memory
  # limits for this internal-only traffic.
  web_scraping.default:
    requests: { rpm: 60, burst: 1.0 }
    scopes: [service]
    fail_mode: fallback_memory

  # Research / websearch endpoints.
  # Applied at ingress for `/api/v1/research/*` (per-user/api_key). The
  # 30 rpm default balances responsiveness with protection against abusive
  # fan‑out across third‑party search/content providers. Tokens are not
  # accounted here; upstream provider quotas remain the primary guardrail.
  research.default:
    requests: { rpm: 120, burst: 2.0 }
    scopes: [user, api_key]

  # Workflows (ad-hoc runs, schedules, admin).
  # This block bounds request rate only. The durable per-user daily runs
  # cap is `limits.workflows_runs_per_day` (spec 2), enforced by
  # quota_checks.workflows_runs_decision, not by this RG policy.
  workflows.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key]

  # Prompt Studio API (projects/prompts/tests/optimization).
  # Policies are applied primarily at ingress for `/api/v1/prompt-studio/*`.
  # Request limits are intentionally high so most safety/abuse controls are
  # handled by AuthNZ module‑level limits (per‑operation) rather than RG.
  prompt_studio.default:
    # Keep high to avoid interfering with per-operation AuthNZ limits.
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key]

  # RAG unified/health endpoints.
  # Covers `/api/v1/rag/*` including unified search and health checks. The
  # 120 rpm default is tuned for interactive usage and small teams; scale
  # out by overriding in DB-backed policy stores for larger deployments.
  rag.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key]

  # Media ingestion/processing endpoints.
  # Applied to ingest/process routes under `/api/v1/media/*` (add, process-*, ingest-web-content, mediawiki).
  # Media processing is CPU/IO heavy, so limits are slightly conservative
  # (600 rpm, modest burst) to prevent local saturation while still allowing
  # concurrent ingestion workflows in development.
  media.default:
    requests: { rpm: 600, burst: 1.2 }
    scopes: [user, api_key]

  # Media access endpoints (listing, item retrieval, file download).
  # This is intentionally higher than ingestion limits so browsing doesn't
  # contend with ingestion quotas.
  media.access:
    requests: { rpm: 6000, burst: 1.2 }
    scopes: [user, api_key]

  # Interactive study tools make several lightweight reads while the user
  # navigates decks, reviews cards, and searches content. Keep these separate
  # from core.default so page boot traffic cannot block a review or quiz action.
  flashcards.default:
    requests: { rpm: 600, burst: 1.2 }
    scopes: [user, api_key, ip]
    fail_mode: fallback_memory

  quizzes.default:
    requests: { rpm: 600, burst: 1.2 }
    scopes: [user, api_key, ip]
    fail_mode: fallback_memory

  # Chatbooks import/export endpoints (legacy ingress compat → RG).
  # Covers `/api/v1/chatbooks/*` used for conversation backup/restore and bulk
  # user-data transfer (export/import). Limits are intentionally conservative
  # (5 rpm, no burst) to prevent accidental or abusive bulk operations that
  # can create heavy DB/file I/O and large payloads. Preview/download are
  # slightly higher to support iterative validation and retrieval of prepared
  # artifacts. Include `ip` in scope as an additional safety valve for shared
  # API keys and to align with legacy ingress behavior.
  chatbooks.export:
    requests: { rpm: 5, burst: 1.0 }
    scopes: [user, api_key, ip]

  chatbooks.import:
    requests: { rpm: 5, burst: 1.0 }
    scopes: [user, api_key, ip]

  chatbooks.preview:
    requests: { rpm: 10, burst: 1.0 }
    scopes: [user, api_key, ip]

  chatbooks.download:
    requests: { rpm: 20, burst: 1.0 }
    scopes: [user, api_key, ip]

  # Watchlists API endpoints (sources/groups/tags/jobs/runs).
  # Applied at ingress for `/api/v1/watchlists/*`. Watchlists can trigger
  # background fetch/scrape work and external fan-out, so defaults are tuned
  # for interactive usage (60 rpm) without enabling bulk abuse. Include `ip`
  # in scope to add a per-client throttle when API keys are shared.
  watchlists.default:
    requests: { rpm: 300, burst: 2.0 }
    scopes: [user, api_key, ip]

# Route/tag mapping helpers. Middleware may use these to resolve policy_id.
route_map:
  # by_path wins over by_tag, so list a tag only if it governs a route no by_path
  # entry matches (Helper_Scripts/ci/rg_route_map_lint.py reports shadowed tags).
  by_tag:
    health: health.default
    organizations: core.default
    org-team-keys: core.default
    writing: core.default
    llamacpp: core.default
    mcp-catalogs-scope: mcp.default
    resource-governor: core.default
  by_path:
    "/health": health.default
    "/metrics": core.default
    "/setup*": core.default
    "/v1/rerank": core.default
    "/v1/reranking": core.default
    "/api/v1/health*": health.default
    "/api/v1/readyz": health.default
    "/api/v1/metrics*": core.default
    "/api/v1/monitoring*": core.default
    "/api/v1/setup*": core.default
    "/api/v1/mcp/tools": mcp.read
    "/api/v1/mcp/status": mcp.read
    "/api/v1/mcp/health": mcp.read
    "/api/v1/mcp/prompts": mcp.read
    "/api/v1/mcp/resources": mcp.read
    "/api/v1/mcp/modules*": mcp.read
    "/api/v1/mcp/request": mcp.default
    "/api/v1/mcp/request/*": mcp.default
    "/api/v1/mcp/auth/*": mcp.default
    "/api/v1/mcp/ws*": mcp.default
    "/api/v1/mcp/*": mcp.default
    "/api/v1/chatbooks/export": chatbooks.export
    "/api/v1/chatbooks/import": chatbooks.import
    "/api/v1/chatbooks/preview": chatbooks.preview
    "/api/v1/chatbooks/download/*": chatbooks.download
    "/api/v1/chatbooks*": core.default
    "/api/v1/chats*": character_chat.default
    "/api/v1/messages*": character_chat.default
    "/api/v1/characters*": character_chat.default
    "/api/v1/chat/*": chat.default
    "/api/v1/embeddings*": embeddings.default
    "/api/v1/vector_stores*": embeddings.default
    "/v1/realtime": audio.default
    "/api/v1/audio*": audio.default
    "/api/v1/evaluations*": evals.default
    "/api/v1/feedback*": evals.default
    "/api/v1/benchmarks*": evals.default
    "/api/v1/research*": research.default
    "/api/v1/paper-search*": research.default
    "/api/v1/web-scraping*": web_scraping.default
    "/api/v1/workflows*": workflows.default
    "/api/v1/scheduler/workflows*": workflows.default
    "/api/v1/prompt-studio*": prompt_studio.default
    "/api/v1/prompts*": prompt_studio.default
    "/api/v1/rag*": rag.default
    "/api/v1/media/add": media.default
    "/api/v1/media/ingest-web-content": media.default
    "/api/v1/media/process-*": media.default
    "/api/v1/media/mediawiki/*": media.default
    "/api/v1/media/*/reprocess": media.default
    "/api/v1/media*": media.access
    "/api/v1/watchlists/*": watchlists.default
    "/api/v1/watchlists*": watchlists.default
    "/api/v1/auth/forgot-password": authnz.forgot_password
    "/api/v1/auth/reset-password": authnz.reset_password
    "/api/v1/auth/resend-verification": authnz.resend_verification
    "/api/v1/auth/magic-link/request": authnz.magic_link.request
    "/api/v1/auth/mfa/verify": authnz.mfa.verify
    "/api/v1/auth/mfa/login": authnz.mfa.login
    "/api/v1/auth/*": authnz.default
    "/api/v1/authnz*": core.default
    "/api/v1/users*": core.default
    "/api/v1/orgs*": core.default
    "/api/v1/invites*": core.default
    "/api/v1/privileges*": core.default
    "/api/v1/admin*": core.default
    "/api/v1/jobs*": core.default
    "/api/v1/audit*": core.default
    "/api/v1/config*": core.default
    "/api/v1/sync*": core.default
    "/api/v1/tools*": core.default
    "/api/v1/claims*": core.default
    "/api/v1/notes*": core.default
    "/api/v1/skills*": core.default
    "/api/v1/personalization*": core.default
    "/api/v1/persona*": character_chat.default
    "/api/v1/reading*": core.default
    "/api/v1/items*": core.default
    "/api/v1/kanban*": core.default
    "/api/v1/outputs/templates*": core.default
    "/api/v1/outputs*": core.default
    "/api/v1/connectors*": core.default
    "/api/v1/moderation*": core.default
    "/api/v1/sandbox*": core.default
    "/api/v1/ocr*": core.default
    "/api/v1/vlm*": core.default
    "/api/v1/llm*": core.default
    "/api/v1/llamacpp*": core.default
    "/api/v1/flashcards*": flashcards.default
    "/api/v1/quizzes*": quizzes.default
    "/api/v1/chunking*": core.default
    "/api/v1/resource-governor*": core.default

# Observability note: Do not include entity label in metrics by default.
# Use RG_METRICS_ENTITY_LABEL=true to enable hashed entity label if necessary.
