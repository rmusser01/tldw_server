modules:
  - id: media
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.media_module:MediaModule
    enabled: true
    name: Media
    version: "1.0.0"
    department: media
    # Module runtime controls (optional)
    # Limit concurrent operations per module instance (0 disables guard)
    max_concurrent: 16
    # Circuit breaker settings
    circuit_breaker_threshold: 3           # failures before breaker opens
    circuit_breaker_timeout: 30            # initial open window (seconds)
    circuit_breaker_backoff_factor: 2.0    # multiply timeout on half-open failure
    circuit_breaker_max_timeout: 180       # cap the backoff window (seconds)
    # Module-specific settings
    settings:
      # Per-user default example; change '1' if SINGLE_USER_FIXED_ID differs
      db_path: Databases/user_databases/1/Media_DB_v2.db
      cache_ttl: 300
  - id: template
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.template_module:TemplateModule
    enabled: true
    name: Template
    version: "1.0.0"
    department: demo
    settings: {}

  - id: mcp_discovery
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.mcp_discovery_module:MCPDiscoveryModule
    enabled: true
    name: MCP Discovery
    version: "1.0.0"
    department: system
    max_concurrent: 8
    settings: {}

  - id: governance
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.governance_module:GovernanceModule
    enabled: true
    name: Governance
    version: "1.0.0"
    department: system
    max_concurrent: 8
    settings:
      sqlite_path: Databases/governance.db

  - id: external_federation
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.external_federation_module:ExternalFederationModule
    enabled: false
    name: External Federation
    version: "0.1.0"
    department: system
    max_concurrent: 8
    settings:
      external_servers_config_path: tldw_Server_API/Config_Files/mcp_external_servers.yaml

  - id: notes
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.notes_module:NotesModule
    enabled: true
    name: Notes
    version: "1.0.0"
    department: knowledge
    max_concurrent: 10
    settings: {}

  - id: persona_visuals
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.persona_visuals_module:PersonaVisualsModule
    enabled: false
    name: Persona Visuals
    version: "1.0.0"
    department: persona
    max_concurrent: 10
    description: Persona visual pack draft and runtime state tools
    settings: {}

  - id: filesystem
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.filesystem_module:FilesystemModule
    enabled: true
    name: Filesystem
    version: "1.0.0"
    department: system
    max_concurrent: 16
    settings: {}

  - id: codegraph
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.codegraph_module:CodeGraphModule
    enabled: false
    name: CodeGraph
    version: "0.1.0"
    department: code
    max_concurrent: 4
    settings:
      index_base_dir: Databases/codegraph
      max_file_size_bytes: 1048576
      foreground_max_files: 500
      foreground_max_bytes: 50000000
      max_index_seconds: 20
      max_context_chars: 35000
      max_search_results: 100

  - id: knowledge
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.knowledge_module:KnowledgeModule
    enabled: true
    name: Knowledge
    version: "1.0.0"
    department: knowledge
    max_concurrent: 10
    settings: {}

  - id: run_command
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.run_command_module:RunCommandModule
    enabled: true
    name: Run Command
    version: "0.1.0"
    department: system
    max_concurrent: 16
    settings:
      spill_dir: ${MCP_RUN_COMMAND_SPILL_DIR:-.mcp/spills}
      spill_threshold_bytes: 65536
      preview_line_limit: 200
      preview_byte_limit: 51200

  - id: kanban
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.kanban_module:KanbanModule
    enabled: true
    name: Kanban
    version: "1.0.0"
    department: planning
    max_concurrent: 10
    settings: {}

  - id: quizzes
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.quizzes_module:QuizzesModule
    enabled: true
    name: Quizzes
    version: "1.0.0"
    department: learning
    max_concurrent: 10
    settings: {}

  - id: flashcards
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.flashcards_module:FlashcardsModule
    enabled: true
    name: Flashcards
    version: "1.0.0"
    department: learning
    max_concurrent: 10
    settings: {}

  - id: slides
    class: tldw_Server_API.app.core.MCP_unified.modules.implementations.slides_module:SlidesModule
    enabled: true
    name: Slides
    version: "1.0.0"
    department: presentations
    max_concurrent: 8
    settings: {}

# Notes
# - Only modules under tldw_Server_API.app.core.MCP_unified.modules.implementations are allowed.
# - You can also specify modules via env: MCP_MODULES="media=tldw_Server_API.app.core.MCP_unified.modules.implementations.media_module:MediaModule"
