          - Chat Pages: User_Guides/WebUI_Extension/Chat_Pages.md
          - Workflow Examples: User_Guides/WebUI_Extension/Workflows_Examples.md
          - STT and TTS Quickstart: User_Guides/WebUI_Extension/Getting-Started-STT_and_TTS.md
          - Chatbooks: User_Guides/WebUI_Extension/Chatbook_User_Guide.md
          - Flashcards: User_Guides/WebUI_Extension/Flashcards_Study_Guide.md
      - Server:
