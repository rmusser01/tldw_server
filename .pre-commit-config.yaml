repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: guard-legacy-complete-nonempty-body
        name: Guard non-empty legacy /complete bodies in tests
        entry: python3 Helper_Scripts/checks/guard_no_nonempty_legacy_complete.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit, push]
      - id: guard-http-client-patching
        name: Guard against raw requests/httpx/aiohttp patching in tests
        entry: python3 Helper_Scripts/checks/guard_http_client_patching.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit, push]
      - id: python-syntax-check
        name: Python syntax check (py_compile)
        entry: python3 Helper_Scripts/checks/check_python_syntax.py
        language: system
        types: [python]
      # Pre-push only: reproduce the gating CI lanes (compileall + guards +
      # pytest on changed tests). The runner auto-uses .venv, so it never runs
      # against system Python. Enable with:
      #   pre-commit install --hook-type pre-push
      # The python launcher name is used for Windows/macOS/Linux compatibility.
      - id: local-ci-fast
        name: Local CI fast tier (pre-push)
        entry: python Helper_Scripts/ci/run_local_ci.py --fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: ^tldw_Server_API/cli/wizard/|^tldw_Server_API/tests/wizard/
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^tldw_Server_API/cli/wizard/|^tldw_Server_API/tests/wizard/
