###########################
# pyproject.toml for tldw_Server_API
###########################
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

###########################
# Project Info
###########################
[project]
name = "tldw-server"
version = "0.1.31"
description = "A comprehensive research assistant and media analysis platform - Too Long; Didn't Watch Server"
requires-python = ">=3.10"
readme = "README.md"
# Use SPDX license expression as a string to avoid deprecation warnings.
# Project is licensed under GPLv3.
license = "GPL-3.0-only"
keywords = ["transcription", "summarization", "media-processing", "llm", "rag", "fastapi", "research-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: FastAPI",
]
authors = [
  { name = "Robert Musser", email = "contact@tldwproject.com" }
]
dependencies = [
  # API Server Core
  "aiofiles>=23.0.0",
  "aiohttp",
  "aioresponses",
  "aiosqlite",
  "apscheduler>=3.10.0",
  "argon2-cffi>=23.0.0",
  "asyncpg",
  "psycopg[binary]>=3.1",
  "cachetools>=5.0.0",
  "click>=8.0.0",
  "click-completion>=0.5.2",
  "typer>=0.12.0",
  "defusedxml>=0.7.0",
  "email-validator>=2.0.0",
  "fastapi>=0.136.3",
  "httpx>=0.24.0",
  "hypothesis",
  "loguru>=0.7.0",
  "lxml>=4.9.0",
  "numpy>=1.24.0",
  "icalendar>=5.0.0",
  "openpyxl>=3.1.2",
  "pandas>=2.0.0",
  "passlib>=1.7.0",
  "prometheus-client",
  "psutil>=5.9.0",
  "pydantic>=2.0.0",
  "pydantic-core>=2.0.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.0",
  "python-dateutil>=2.9.0",
  "python-magic>=0.4.0",
  "python-multipart>=0.0.27",
