project_name: "tldw_server2"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["Acceptance criteria completed", "Tests or verification recorded", "Documentation updated when relevant", "Bandit run for touched code when applicable or document non-code/environment skip", "Final summary added", "Known skips or blockers documented"]
